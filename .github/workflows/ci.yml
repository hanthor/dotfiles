name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR supersedes the in-flight run. Other events get
# a per-commit group: a shared group would still let GitHub cancel a *queued*
# master run when the next merge lands, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PRs (including agent PRs) run with a read-only token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          pip install yamllint
          sudo apt-get install -y shellcheck

      - name: yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments-indentation: disable, comments: disable, braces: disable, indentation: disable, commas: disable, empty-lines: disable}}" .

      - name: shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -type f -print0 | xargs -0 shellcheck -x -S error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JSON validity
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            [ -f "$f" ] || { echo "$f: SKIP (not a regular file)"; continue; }
            python3 -m json.tool "$f" > /dev/null && echo "$f: OK" || { echo "$f: INVALID"; exit 1; }
          done

      - name: Compile Python scripts
        run: git ls-files '*.py' | xargs python3 -m py_compile


  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: extractions/setup-just@v4

      - name: pytest
        run: uvx --with pyyaml pytest -q tests

  osquery-smoke:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install native inventory dependency
        run: |
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) exit 1 ;; esac
          sudo curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_$arch" -o /usr/local/bin/yq
          sudo chmod 755 /usr/local/bin/yq

      # The hosted runner is not on the fleet tailnet. Keep Punjab's real
      # inventory variables and server membership, but do not claim remote
      # discovery or remote host health in this local integration smoke.
      - name: Select local smoke inventory
        run: |
          yq -i '.all.hosts |= with_entries(select(.key == "punjab")) |
            .all.children = {"server": {"hosts": {"punjab": null}}}' inventory.yml

      - name: Install actual native osquery and private reporting
        run: |
          echo punjab | sudo tee /etc/dotfiles-machine >/dev/null
          DOTFILES_MACHINE=punjab bash units/osquery.sh

      - name: Exercise real socket, enabled unit and baseline transitions
        run: sudo python3 tests/osquery_smoke.py

      - name: Prove pending listener drift reaches the private poller snapshot
        run: sudo python3 tests/osquery_poller_smoke.py --snapshot "$HOME/.local/state/fleet-osquery/latest.json"

      - name: Verify poller opt-out stops the schedule and service
        run: |
          yq -i '.osquery_poller_enabled = false' host_vars/punjab.yml
          DOTFILES_MACHINE=punjab bash units/osquery.sh
          test "$(systemctl show fleet-osquery-poll.timer -p ActiveState --value)" = inactive
          test "$(systemctl show fleet-osquery-poll.timer -p UnitFileState --value)" = disabled
          test "$(systemctl show fleet-osquery-poll.service -p ActiveState --value)" = inactive

      - name: Diagnose osquery smoke failure
        if: ${{ failure() }}
        run: |
          sudo systemctl status fleet-osquery-poll.service fleet-osquery-report.service osqueryd.service --no-pager -l || true
          sudo journalctl -b --no-pager -u fleet-osquery-poll.service -u fleet-osquery-report.service -u osqueryd.service -n 200 || true
          if [ -f "$HOME/.local/state/fleet-osquery/latest.json" ]; then
            echo 'Snapshot error reasons (no report contents):'
            jq -r '(.error // empty), (.hosts[]? | select(.status == "error" or .status == "stale") | .reason // empty)' \
              "$HOME/.local/state/fleet-osquery/latest.json" | sort -u || true
          fi
          command -v tailscale || echo 'tailscale CLI not found'
          systemctl is-active tailscaled.service || true

  # Renovate may bump pi's npm deps unreviewed (CODEOWNERS carve-out); this
  # makes sure a PR can't *add* or remove one without a human.
  deps-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: package.json dependency set unchanged
        run: |
          f=roles/pi/files/package.json
          base="origin/${{ github.base_ref }}"
          git diff --quiet "$base"...HEAD -- "$f" && { echo "untouched"; exit 0; }
          keys() { python3 -c 'import json,sys; d=json.load(sys.stdin); print(sorted({k for s in ("dependencies","devDependencies","optionalDependencies","peerDependencies") for k in d.get(s,{})}))'; }
          before=$(git show "$base:$f" | keys); after=$(keys < "$f")
          echo "before: $before"; echo "after:  $after"
          [ "$before" = "$after" ] || { echo "::error::$f dependency set changed — needs a human-authored PR"; exit 1; }

  justfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Validate Justfile
        run: just --justfile Justfile --list

  tofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2

      - name: fmt
        run: tofu fmt -check -recursive

      - name: validate
        run: tofu init -backend=false -input=false && tofu validate

      - name: test (mock provider, no AWS access)
        run: tests/run.sh

  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/secret-broker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/secret-broker/go.mod
          cache-dependency-path: tools/secret-broker/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...
