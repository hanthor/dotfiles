# Utah masks ttyS0 because absent UARTs can otherwise respawn agetty forever.
# /dev/ttyS0 may exist even when the kernel reports no UART at that port.
[Service]
ExecCondition=/usr/bin/sh -c '/usr/bin/grep -q "^0: uart:" /proc/tty/driver/serial && ! /usr/bin/grep -q "^0: uart:unknown" /proc/tty/driver/serial'
