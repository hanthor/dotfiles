[book]
title = "Infrastructure Handbook"
authors = ["James Reilly"]
language = "en"
description = "James Reilly's personal fleet (Ansible dotfiles) and the TunaOS infrastructure it administers"

[build]
build-dir = "book"

[output.html]
# Canonical home is https://reilly.asia/infra/ (the reilly.asia Worker proxies
# /infra/* to this repo's GitHub Pages build).
site-url = "/infra/"
no-section-label = true
git-repository-url = "https://github.com/hanthor/dotfiles"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/hanthor/dotfiles/edit/master/{path}"

[output.html.fold]
enable = true
level = 1
