---
# ── PI Coding Agent: extensions, packages, and settings ───────────────
# Requires: auth.json (created by shell_ai role from Bitwarden)

- name: Ensure ~/.pi/agent directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent"
    state: directory
    mode: "0755"

- name: Deploy pi settings.json (provider, model, packages)
  ansible.builtin.copy:
    src: settings.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/settings.json"
    mode: "0644"

- name: Ensure pi npm directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/npm"
    state: directory
    mode: "0755"

- name: Deploy pi npm package.json (extension dependencies)
  ansible.builtin.copy:
    src: package.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/npm/package.json"
    mode: "0644"

- name: Install pi npm extension packages
  ansible.builtin.command:
    cmd: npm install --no-audit --no-fund --omit=dev
    chdir: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/npm"
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: pi_npm_install
  changed_when: "'added' in (pi_npm_install.stdout | default('')) or 'removed' in (pi_npm_install.stdout | default('')) or 'updated' in (pi_npm_install.stdout | default('')) or 'changed' in (pi_npm_install.stdout | default(''))"
  failed_when: false

- name: Ensure pi extensions directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions"
    state: directory
    mode: "0755"

- name: Deploy claude-import extension (patched with selector menu)
  ansible.builtin.copy:
    src: claude-import.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/claude-import.ts"
    mode: "0644"

# ── SearXNG web search skill ────────────────────────────────────────────

- name: Ensure pi skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/skills/james/searxng-search"
    state: directory
    mode: "0755"

- name: Deploy searxng-search SKILL.md
  ansible.builtin.copy:
    src: skills/searxng-search/SKILL.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/skills/james/searxng-search/SKILL.md"
    mode: "0644"

- name: Deploy searxng-search script
  ansible.builtin.copy:
    src: skills/searxng-search/search.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/skills/james/searxng-search/search.sh"
    mode: "0755"
