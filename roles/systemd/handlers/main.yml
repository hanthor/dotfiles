---
# "Reload systemd user daemon" now lives in the shared systemd_handlers
# role (a meta dependency of this one). This handler is notified only from
# this role, so it stays here.

- name: Restart podman socket
  ansible.builtin.systemd:
    name: podman.socket
    scope: system
    state: restarted
    daemon_reload: true
  become: true
