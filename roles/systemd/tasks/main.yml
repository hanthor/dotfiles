---
# Detect if podman is available on this system
- name: Check if podman is installed
  ansible.builtin.stat:
    path: /usr/bin/podman
  register: podman_available

- name: Ensure podman group exists
  ansible.builtin.group:
    name: podman
    system: true
    state: present
  become: true
  when: podman_available.stat.exists

- name: Add user to podman group
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    groups: podman
    append: true
  become: true
  when: podman_available.stat.exists

- name: Create podman socket drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    state: directory
    mode: "0755"
  become: true
  when: podman_available.stat.exists

- name: Deploy podman socket drop-in for group access
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/group-access.conf
    mode: "0644"
    content: |
      [Socket]
      SocketGroup=podman
      SocketMode=0660
      DirectoryMode=0710
  become: true
  notify: Restart podman socket
  when: podman_available.stat.exists

- name: Enable and start rootful podman socket
  ansible.builtin.systemd:
    name: podman.socket
    scope: system
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: podman_available.stat.exists

- name: Debug message for systems without podman
  ansible.builtin.debug:
    msg: "Podman not found on this system, skipping socket configuration"
  when: not podman_available.stat.exists

- name: Create systemd user directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Deploy dotfiles-update service
  ansible.builtin.template:
    src: dotfiles-update.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dotfiles-update.service"
    mode: "0644"
  notify: Reload systemd user daemon

# Laptops: run on login/boot via graphical-session, no periodic timer
- name: Enable dotfiles-update service on login (laptop)
  ansible.builtin.systemd:
    name: dotfiles-update.service
    scope: user
    enabled: true
  when: is_laptop | bool and dotfiles_auto_update | default(true) | bool

- name: Stop and disable dotfiles-update service when automatic updates are off
  ansible.builtin.systemd:
    name: dotfiles-update.service
    scope: user
    enabled: false
    state: stopped
  when: is_laptop | bool and not (dotfiles_auto_update | default(true) | bool)
  failed_when: false

- name: Remove disabled dotfiles-update service unit
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dotfiles-update.service"
    state: absent
  when: is_laptop | bool and not (dotfiles_auto_update | default(true) | bool)
  notify: Reload systemd user daemon

- name: Remove dotfiles-update timer on laptop (not needed)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dotfiles-update.timer"
    state: absent
  when: is_laptop | bool

# Desktops/servers: daily timer
- name: Deploy dotfiles-update timer (non-laptop)
  ansible.builtin.template:
    src: dotfiles-update.timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dotfiles-update.timer"
    mode: "0644"
  when: not (is_laptop | bool)
  notify: Reload systemd user daemon

- name: Enable and start dotfiles-update timer (non-laptop)
  ansible.builtin.systemd:
    name: dotfiles-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  when: not (is_laptop | bool)
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy atuin daemon service
  ansible.builtin.template:
    src: atuin-daemon.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/atuin-daemon.service"
    mode: "0644"
  notify: Reload systemd user daemon

- name: Enable and start atuin daemon
  ansible.builtin.systemd:
    name: atuin-daemon.service
    scope: user
    enabled: true
    state: started

- name: Deploy system-mitigator script (Lenovo 400MHz/Journald health)
  ansible.builtin.copy:
    src: system-mitigator.py
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/system-mitigator.py"
    mode: "0755"
  when: inventory_hostname == 'himachal'

- name: Deploy system-mitigator service template
  ansible.builtin.template:
    src: system-mitigator.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/system-mitigator.service"
    mode: "0644"
  when: inventory_hostname == 'himachal'
  notify: Reload systemd user daemon

- name: Enable and start system-mitigator daemon
  ansible.builtin.systemd:
    name: system-mitigator.service
    scope: user
    enabled: true
    state: started
  when: inventory_hostname == 'himachal'

# Phone hosts (termux, mumbai) can't reliably self-apply on a schedule —
# Termux can't run Ansible at all (no Rust target for the cryptography
# dependency), and neither host is always reachable (asleep, app killed,
# off tailnet). himachal periodically pushes to them instead, tolerating
# unreachable as the expected common case rather than an error.
- name: Deploy phone-apply service template
  ansible.builtin.template:
    src: phone-apply.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/phone-apply.service"
    mode: "0644"
  when: inventory_hostname == 'himachal'
  notify: Reload systemd user daemon

- name: Deploy phone-apply timer template
  ansible.builtin.template:
    src: phone-apply.timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/phone-apply.timer"
    mode: "0644"
  when: inventory_hostname == 'himachal'
  notify: Reload systemd user daemon

- name: Enable and start phone-apply timer
  ansible.builtin.systemd:
    name: phone-apply.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  when: inventory_hostname == 'himachal' and phone_apply_enabled | default(true) | bool

- name: Stop and disable phone-apply timer when automatic pushes are off
  ansible.builtin.systemd:
    name: phone-apply.timer
    scope: user
    enabled: false
    state: stopped
  when: inventory_hostname == 'himachal' and not (phone_apply_enabled | default(true) | bool)
  failed_when: false

- name: Remove disabled phone-apply units
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ item }}"
    state: absent
  loop:
    - phone-apply.service
    - phone-apply.timer
  when: inventory_hostname == 'himachal' and not (phone_apply_enabled | default(true) | bool)
  notify: Reload systemd user daemon
