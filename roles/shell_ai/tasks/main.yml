---
# ── AI Coding Tools configuration ────────────────────────────────

# ── Per-host secrets from Bitwarden (DeepSeek + Forgejo) ─────────
# Gated on `secrets_available` (published by the bitwarden role) so a locked
# vault leaves any previously-written secret files untouched instead of writing
# empty values.
- name: Fetch and deploy shell secrets from Bitwarden
  when: secrets_available | default(false)
  environment:
    BW_SESSION: "{{ bw_session }}"
    PATH: "{{ ansible_env_path }}"
  block:
    - name: Fetch DeepSeek API key from Bitwarden
      ansible.builtin.command: bw get password deepseek-api-key
      register: deepseek_key
      no_log: true
      changed_when: false
      failed_when: false


    - name: Fetch Forgejo API token from Bitwarden
      ansible.builtin.shell: |
        set -euo pipefail
        bw get notes forgejo | grep "API Token:" | sed 's/API Token: //'
      register: forgejo_token
      no_log: true
      changed_when: false
      failed_when: false

    # The OMP DeepSeek provider consumes this env var; the API key never lands
    # in the agent config or this public repository.
    - name: Fetch Tavily API key from Bitwarden
      ansible.builtin.command: bw get password tavily-api-key
      register: tavily_key
      no_log: true
      changed_when: false
      failed_when: false

    # Meta Model API key (Muse Spark) lives in a Bitwarden secure note.
    - name: Fetch Meta API key from Bitwarden
      ansible.builtin.command: bw get notes meta-api-key
      register: meta_key
      no_log: true
      changed_when: false
      failed_when: false

    # OMP's Kiro provider sends this API key directly to Kiro's runtime API.
    # It is separate from the OAuth bearer stored by OMP/kiro-cli.
    - name: Fetch Kiro API key from Bitwarden
      ansible.builtin.command: bw get notes kiro-api-key
      register: kiro_key
      no_log: true
      changed_when: false
      failed_when: false

    - name: Write shell secrets file
      ansible.builtin.copy:
        content: |
          # Managed by dotfiles playbook — DO NOT EDIT
          export OMP_KIRO_CONFIG="$HOME/.config/omp/kiro.json"
          {% if deepseek_key.rc == 0 and deepseek_key.stdout | trim | length > 0 %}
          export DEEPSEEK_API_KEY={{ deepseek_key.stdout | trim | quote }}
          {% endif %}
          {% if forgejo_token.rc == 0 and forgejo_token.stdout | trim | length > 0 %}
          export FORGEJO_TOKEN={{ forgejo_token.stdout | trim | quote }}
          {% endif %}
          {% if tavily_key.rc == 0 and tavily_key.stdout | trim | length > 0 %}
          export TAVILY_API_KEY={{ tavily_key.stdout | trim | quote }}
          {% endif %}
          {% if meta_key.rc == 0 and meta_key.stdout | trim | length > 0 %}
          export META_API_KEY={{ meta_key.stdout | trim | quote }}
          {% endif %}
          {% if kiro_key.rc == 0 and kiro_key.stdout | trim | length > 0 %}
          export KIRO_API_KEY={{ kiro_key.stdout | trim | quote }}
          {% endif %}
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/shell/secrets.sh"
        mode: "0600"
      no_log: true
      when: >-
        (deepseek_key.rc == 0 and deepseek_key.stdout | trim | length > 0)
        or (forgejo_token.rc == 0 and forgejo_token.stdout | trim | length > 0)
        or (tavily_key.rc == 0 and tavily_key.stdout | trim | length > 0)
        or (meta_key.rc == 0 and meta_key.stdout | trim | length > 0)
        or (kiro_key.rc == 0 and kiro_key.stdout | trim | length > 0)

    # Fish doesn't source secrets.sh; give it the same values via conf.d.
    - name: Ensure fish conf.d directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/conf.d"
        state: directory
        mode: "0755"
      when: >-
        (deepseek_key.rc == 0 and deepseek_key.stdout | trim | length > 0)
        or (forgejo_token.rc == 0 and forgejo_token.stdout | trim | length > 0)
        or (tavily_key.rc == 0 and tavily_key.stdout | trim | length > 0)
        or (meta_key.rc == 0 and meta_key.stdout | trim | length > 0)
        or (kiro_key.rc == 0 and kiro_key.stdout | trim | length > 0)

    - name: Write fish secrets file
      ansible.builtin.copy:
        content: |
          # Managed by dotfiles playbook — DO NOT EDIT
          {% if deepseek_key.rc == 0 and deepseek_key.stdout | trim | length > 0 %}
          set -gx DEEPSEEK_API_KEY {{ deepseek_key.stdout | trim | quote }}
          {% endif %}
          {% if forgejo_token.rc == 0 and forgejo_token.stdout | trim | length > 0 %}
          set -gx FORGEJO_TOKEN {{ forgejo_token.stdout | trim | quote }}
          {% endif %}
          {% if tavily_key.rc == 0 and tavily_key.stdout | trim | length > 0 %}
          set -gx TAVILY_API_KEY {{ tavily_key.stdout | trim | quote }}
          {% endif %}
          {% if meta_key.rc == 0 and meta_key.stdout | trim | length > 0 %}
          set -gx META_API_KEY {{ meta_key.stdout | trim | quote }}
          {% endif %}
          {% if kiro_key.rc == 0 and kiro_key.stdout | trim | length > 0 %}
          set -gx KIRO_API_KEY {{ kiro_key.stdout | trim | quote }}
          {% endif %}
          if command -v bw >/dev/null 2>&1; and test -r /tmp/bw_session
            set -gx KIRO_API_KEY (env BW_SESSION=(cat /tmp/bw_session) bw get item 2706eda5-e8ad-43df-9838-b4e00167e95d 2>/dev/null | jq -r .notes)
            test "$KIRO_API_KEY" = null; and set -e KIRO_API_KEY
          end
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/fish/conf.d/secrets.fish"
        mode: "0600"
      no_log: true
      when: >-
        (deepseek_key.rc == 0 and deepseek_key.stdout | trim | length > 0)
        or (forgejo_token.rc == 0 and forgejo_token.stdout | trim | length > 0)
        or (tavily_key.rc == 0 and tavily_key.stdout | trim | length > 0)
        or (meta_key.rc == 0 and meta_key.stdout | trim | length > 0)
        or (kiro_key.rc == 0 and kiro_key.stdout | trim | length > 0)

- name: Warn if deepseek-api-key not found in Bitwarden
  ansible.builtin.debug:
    msg: >-
      Bitwarden item 'deepseek-api-key' not found — skipping DEEPSEEK_API_KEY.
      OMP/Kiro OAuth can still be configured with `/login kiro`.
  when:
    - secrets_available | default(false)
    - (deepseek_key | default({})).rc | default(1) != 0
      or (deepseek_key | default({})).stdout | default('') | trim | length == 0
