---
# Package + sshd management for the raw Termux/Android layer on the phone.
# Only runs for hosts in the `termux` inventory group — see site.yml.

- name: Update pkg package cache
  ansible.builtin.command: pkg update -y
  changed_when: true
  register: termux_pkg_update
  until: termux_pkg_update.rc == 0
  retries: 3
  delay: 5

- name: Install Termux packages
  ansible.builtin.command:
    cmd: "pkg install -y {{ termux_pkgs | join(' ') }}"
  changed_when: "'Setting up' in (termux_pkg_install.stdout | default(''))"
  register: termux_pkg_install

- name: Install global npm packages
  ansible.builtin.command:
    cmd: "npm install -g {{ item }}"
  loop: "{{ termux_npm_global }}"
  register: termux_npm_install
  changed_when: "'added' in (termux_npm_install.stdout | default(''))"

- name: Ensure Termux:Boot directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.termux/boot"
    state: directory
    mode: "0755"

- name: Deploy sshd boot script
  ansible.builtin.template:
    src: start-sshd.sh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.termux/boot/start-sshd"
    mode: "0755"

- name: Check if sshd is currently running
  ansible.builtin.command: pgrep -x sshd
  register: termux_sshd_running
  changed_when: false
  failed_when: false

- name: Start sshd if not running
  ansible.builtin.command: sshd
  when: termux_sshd_running.rc != 0

# Termux:Boot only fires at device boot — if Android kills the app in the
# background between opens (common; a phone isn't an always-on machine),
# sshd goes unreachable until the user manually reopens Termux. Android's
# native JobScheduler (exposed via termux-job-scheduler, part of
# Termux:API) survives that: it wakes the app periodically regardless of
# whether it was killed, so we reuse the boot script as a periodic job
# too — same wake-lock + ensure-sshd logic, just on a timer instead of
# only at boot.
- name: Check currently scheduled Termux jobs
  ansible.builtin.command: termux-job-scheduler -p
  register: termux_jobs_pending
  changed_when: false
  failed_when: false

- name: Schedule periodic sshd keep-alive job
  ansible.builtin.command:
    cmd: >-
      termux-job-scheduler
      --job-id 1
      --period-ms {{ termux_keepalive_period_ms }}
      --persisted true
      -s {{ ansible_facts['env']['HOME'] }}/.termux/boot/start-sshd
  when: "'Pending Job 1' not in (termux_jobs_pending.stdout | default(''))"
