---
- name: Determine native osquery support
  ansible.builtin.set_fact:
    osquery_native_supported: >-
      {{ osquery_supported | bool
         and ansible_facts['system'] == 'Linux'
         and ansible_facts['service_mgr'] | default('') == 'systemd'
         and ansible_facts['architecture'] in osquery_release_archives
         and not is_musl | default(false) | bool
         and not is_termux | default(false) | bool
         and inventory_hostname not in groups.get('vps', []) }}

- name: Explain unsupported osquery platform
  ansible.builtin.debug:
    msg: >-
      osquery not installed: requires native glibc Linux, systemd, root and
      x86_64/aarch64. musl/Android and retired VPSes are not modified.
  when: not osquery_native_supported | bool

- name: Explain osquery check-mode boundary
  ansible.builtin.debug:
    msg: "osquery support detected; release installation and live baseline collection require an apply (not check mode)."
  when: osquery_native_supported | bool and ansible_check_mode

- name: Install native osquery monitoring
  ansible.builtin.include_tasks: install.yml
  when: osquery_native_supported | bool and not ansible_check_mode

- name: Manage the always-on fleet poller
  ansible.builtin.include_tasks: poller.yml
  when: osquery_native_supported | bool and not ansible_check_mode
