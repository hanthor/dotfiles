---
# Only the host that drives the hive should run these timers — two hosts both
# rotating models or pausing agents would fight each other. Opt a host in with
# `hive_ops_enabled: true` in its host_vars.
hive_ops_enabled: false

# Hive now runs on the AWS Talos cluster. The scripts default to this too, but
# the systemd units set it explicitly so they don't depend on shell rc files.
hive_ops_kubeconfig: "{{ ansible_facts['env']['HOME'] }}/.kube/config-aws-migration"

hive_ops_timers:
  - hive-watchdog
  - hive-rotate
  - hive-tiers
  - hive-peak-pause
  - hive-peak-resume
  - hive-repo-sync
  - hive-fork-drift
  - hive-metrics
# pi-peak-start/stop were removed 2026-09-02. They ran
# `systemctl --user start|stop pi.service` to dodge DeepSeek peak pricing, but
# the pi contributor moved to Kubernetes (talos-k8s/hive-contributors,
# pi-codex-contributor) so that local quadlet no longer exists — the units
# failed with NOTINSTALLED on every fire. The DeepSeek rationale is gone too:
# that worker now runs openai-codex/gpt-5.6-sol, which DeepSeek's peak pricing
# does not touch. hive-peak-pause/resume still apply — they gate the in-cluster
# hive AGENTS, which can still be placed on DeepSeek rungs.

# systemd user units get a minimal PATH that excludes Homebrew, where kubectl
# and jq live, and ~/.local/bin, where gh lives (hive-fork-drift.sh's PR
# lookups). Prepend both so the scripts can find their tools.
hive_ops_path: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/usr/bin:/bin"
