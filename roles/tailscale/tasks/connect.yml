---
# Join tailnet: fetch authkey from BW, cleanup old device, run tailscale up.

# Need BW to join tailscale (auth key lives there).
- name: Warn and skip tailscale join (vault locked)
  ansible.builtin.debug:
    msg: >-
      tailscale is not connected but the Bitwarden vault is locked on this host,
      so the auth key can't be fetched. Unlock the vault (`bw unlock`,
      `printf '%s' "$session" > /tmp/bw_session`) and re-run.
  when: not (bw_unlocked | default(false))

- name: End role if vault is locked
  ansible.builtin.meta: end_role
  when: not (bw_unlocked | default(false))

- name: Fetch tailscale auth/API key from Bitwarden
  ansible.builtin.shell: set -o pipefail && bw get item tailscale-apikey | python3 -c "import sys,json; print(json.load(sys.stdin)['login']['password'])"
  register: tailscale_apikey
  changed_when: false
  no_log: true
  environment:
    PATH: "{{ ansible_env_path }}"
    BW_SESSION: "{{ bw_session }}"

# A stale device that still holds this hostname makes Tailscale join us as
# <hostname>-1. scripts/tailnet.py exchanges the OAuth client secret for an API
# token (the old inline cleanup used it as a classic API key, got a silent 401,
# and never deleted anything).
- name: Remove stale tailscale devices with this hostname
  ansible.builtin.command: python3 {{ playbook_dir }}/scripts/tailnet.py release {{ inventory_hostname }}
  environment:
    TS_OAUTH_CLIENT_SECRET: "{{ tailscale_apikey.stdout }}"
  register: ts_release
  changed_when: "'deleted' in ts_release.stdout"
  failed_when: false
  no_log: true
  when: tailscale_apikey.stdout | default('') | length > 0

- name: Join tailscale network
  ansible.builtin.command: tailscale up --authkey {{ tailscale_apikey.stdout }} --advertise-tags=tag:fleet --accept-routes --hostname {{ inventory_hostname }}
  become: true
  no_log: true

- name: Advertise subnet routes after join
  ansible.builtin.command: >
    tailscale up --advertise-routes={{ tailscale_advertise_routes }}
    --reset=false
  become: true
  when: tailscale_advertise_routes is defined
  changed_when: true
