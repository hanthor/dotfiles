# Merged into ~/.omp/agent/config.yml by roles/omp (yq deep-merge; lists replace).
# Order everywhere: Claude Max → Codex → Antigravity → Muse Code → Kiro → OpenRouter.
# omp-route (aliased to `omp`) picks the starting model from ccleft quota;
# these chains handle exhaustion mid-session.
# Every id here must resolve in `omp models`; tests/test_omp_routing.py checks each is
# allow-listed. OpenRouter ids carry the upstream prefix (openrouter/openrouter/auto),
# and the Codex account only offers gpt-6-luna / gpt-5.6-* (gpt-6.1-sol is OpenRouter-only).
modelRoles:
  default: anthropic/claude-opus-5-5
  slow: anthropic/claude-opus-5-5
  advisor: openai-codex/gpt-6-luna
  vision: muse-code/muse-spark-1.3 # image input; Antigravity (gemini) is the fallback
  smol: muse-code/muse-spark-1.3 # claude-haiku-4* is blocked (see enabledModels)
retry:
  modelFallback: true
  fallbackOn: any
  fallbackRevertPolicy: cooldown-expiry # drift back to Claude once its window resets
  usageAwareFallback: true
  usageReservePct: 0 # no reserve: stay on Claude Max until its window is actually spent
  usageReservePolicy: auto # switch at the reserve without prompting
  fallbackChains:
    default: &chain
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6-luna
      - google-antigravity/claude-opus-5-5
      - google-antigravity/gemini-3.8-flash
      - muse-code/muse-wonder-1.0
      - muse-code/muse-spark-1.3
      - kiro/auto
      - openrouter/openrouter/auto
    slow: *chain
    advisor:
      - openai-codex/gpt-6-luna
      - anthropic/claude-opus-5-5
      - google-antigravity/claude-opus-5-5
      - muse-code/muse-wonder-1.0
      - kiro/auto
      - openrouter/openrouter/auto
    smol:
      - muse-code/muse-spark-1.3
      - google-antigravity/gemini-3.8-flash
      - google-antigravity/gemini-4-argon-low
      - google-antigravity/gemini-3.5-flash-lite
      - kiro/gpt-5.6-sol
      - kiro/auto
      - anthropic/claude-sonnet-5-5
    vision:
      - muse-code/muse-spark-1.3
      - google-antigravity/gemini-3.8-flash
      - anthropic/claude-sonnet-5-5
# enabledModels is an allow-list with no negation, so anthropic/* is spelled out
# to leave out claude-haiku-4* (4-5 and its dated alias today). haiku-5* stays allowed.
enabledModels:
  - anthropic/*opus*
  - anthropic/*sonnet*
  - anthropic/*fable*
  - anthropic/*mythos*
  - anthropic/claude-haiku-5*
  - openai-codex/*
  - google-antigravity/*
  - muse-code/*
  - kiro/*
  - openrouter/*
  - local/*
  - lemonade/*
  - web/*
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
