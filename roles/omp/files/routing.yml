# Merged into ~/.omp/agent/config.yml by roles/omp (yq deep-merge; lists replace).
# Local machines burn full quota (usageReservePct: 0); the Hive fleet keeps
# its own 15% reserve in contributors-omp.yaml. Degrade order inside each
# provider family: Sol -> Luna, Opus -> Sonnet.
# omp-route (aliased to `omp`) picks the starting model from ccleft quota;
# these chains handle exhaustion mid-session.
modelRoles:
  default: openai-codex/gpt-6.1-sol
  plan: openai-codex/gpt-6.1-sol:high
  smol: anthropic/claude-haiku-4-5
  advisor: openai-codex/gpt-6.1-sol
  slow: anthropic/claude-opus-5-5
  # Heavy-hitters on demand: `--model @max` (never auto-selected).
  max: google-antigravity/gemini-4-argon-high
  vision: google-antigravity/gemini-3.8-flash
retry:
  modelFallback: true
  fallbackOn: any
  fallbackRevertPolicy: cooldown-expiry # drift back to Claude once its window resets
  usageAwareFallback: true
  usageReservePct: 0 # personal machines use the full quota; hive keeps 15%
  usageReservePolicy: auto # switch at the reserve without prompting
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol
      - openai-codex/gpt-6-luna
      - openai-codex/gpt-5.6-luna
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - google-antigravity/claude-opus-5-5
      - google-antigravity/claude-sonnet-5-5
      - google-antigravity/gemini-3.8-flash
      - kiro/gpt-5.6-sol
      - kiro/gpt-5.6-luna
      - meta/muse-spark-1.3-contributor
    plan:
      - openai-codex/gpt-6.1-sol
      - openai-codex/gpt-6-luna
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - google-antigravity/claude-opus-5-5
      - google-antigravity/claude-sonnet-5-5
      - google-antigravity/gemini-4-argon-high
      - google-antigravity/gemini-4-argon-medium
      - google-antigravity/gemini-3.8-flash
      - kiro/gpt-5.6-sol
      - meta/muse-spark-1.3-contributor
    max:
      - google-antigravity/gemini-4-argon-high
      - openai-codex/gpt-6-astra
      - anthropic/claude-fable-5-1
      - google-antigravity/gemini-4-argon-medium
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
      - google-antigravity/gemini-3.8-flash
      - meta/muse-spark-1.3-contributor
    smol:
      - anthropic/claude-haiku-4-5
      - google-antigravity/gemini-3.8-flash
      - google-antigravity/gemini-4-argon-low
      - google-antigravity/gemini-3.5-flash
      - google-antigravity/gemini-3.1-flash-lite
      - google-antigravity/gemini-2.5-flash
      - kiro/gpt-5.6-sol
    slow:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - openai-codex/gpt-6.1-sol
      - openai-codex/gpt-6-luna
      - google-antigravity/claude-opus-5-5
      - google-antigravity/claude-sonnet-5-5
      - google-antigravity/gemini-4-argon-high
      - google-antigravity/gemini-4-argon-medium
      - google-antigravity/gemini-3.8-flash
      - kiro/gpt-5.6-sol
      - meta/muse-spark-1.3-contributor
    advisor:
      - openai-codex/gpt-6.1-sol
      - openai-codex/gpt-6-luna
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - google-antigravity/claude-opus-5-5
      - google-antigravity/claude-sonnet-5-5
      - google-antigravity/gemini-3.8-flash
      - kiro/gpt-5.6-sol
      - meta/muse-spark-1.3-contributor
prewalk:
  enabled: true
  auto: on
  autoTarget: "@smol"
modelPresets:
  deep:
    modelRoles:
      default: openai-codex/gpt-6.1-sol
      plan: openai-codex/gpt-6.1-sol:high
      smol: anthropic/claude-haiku-4-5
      slow: anthropic/claude-opus-5-5
    defaultThinkingLevel: high
  cheap:
    modelRoles:
      default: google-antigravity/gemini-3.8-flash
      plan: google-antigravity/gemini-4-argon-high
      smol: google-antigravity/gemini-3.8-flash
      slow: google-antigravity/claude-sonnet-5-5
    defaultThinkingLevel: off
enabledModels:
  - anthropic/*
  - openai-codex/*
  - google-antigravity/*
  - kiro/*
  - meta/muse-spark-1.3-contributor
  - local/*
  - web/*
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
