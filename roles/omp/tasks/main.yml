---
- name: Ensure installer cache exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache"
    state: directory
    mode: "0700"
  when: is_musl | bool

- name: Download OMP installer on musl systems
  ansible.builtin.get_url:
    url: https://omp.sh/install
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/omp-install.sh"
    mode: "0700"
  when: is_musl | bool

- name: Install OMP on musl systems
  ansible.builtin.command: sh {{ ansible_facts['env']['HOME'] }}/.cache/omp-install.sh --binary
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp"
  environment:
    PI_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  when: is_musl | bool

- name: Download Bun installer on musl systems
  ansible.builtin.get_url:
    url: https://bun.sh/install
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/bun-install.sh"
    mode: "0700"
  when: is_musl | bool

- name: Install Bun on musl systems for OMP plugins
  ansible.builtin.command: bash {{ ansible_facts['env']['HOME'] }}/.cache/bun-install.sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.bun/bin/bun"
  when: is_musl | bool


- name: Verify OMP is installed
  ansible.builtin.command: omp --version
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  changed_when: false

- name: Ensure OMP personal skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    state: directory
    mode: "0755"

- name: Deploy personal skills to OMP
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pi/files/skills/"
    dest: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james/"
    mode: "0644"
    directory_mode: "0755"

- name: Find skill scripts that need to be executable
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    patterns: "*.sh,*.mjs"
    recurse: true
  register: omp_skill_scripts

- name: Make skill scripts executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
  loop: "{{ omp_skill_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Ensure Claude skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory
    mode: "0755"

- name: Enumerate deployed OMP skills
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    file_type: directory
    recurse: false
  register: omp_skill_dirs

- name: Link OMP skills into Claude's skill directory
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ omp_skill_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Check installed OMP plugins
  ansible.builtin.command: omp plugin list --json
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  register: omp_plugin_list
  changed_when: false
  failed_when: false

- name: Install Kiro provider plugin from GitHub
  ansible.builtin.command:
    cmd: omp plugin install github:elkibalion/omp-kiro-provider
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  when: omp_plugin_list.rc != 0 or 'omp-kiro-provider' not in (omp_plugin_list.stdout | default(''))

- name: Install ccleft (provider quota-remaining probe)
  ansible.builtin.command: go install github.com/tuna-os/ccleft/cmd/ccleft@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/go/bin/ccleft"
  failed_when: false

- name: Deploy omp-kiro-provider config (kiro-cli ACP fallback on 401/403)
  ansible.builtin.copy:
    src: kiro.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/omp/kiro.json"
    mode: "0644"

- name: Install omp-route (quota-aware omp launcher via ccleft)
  ansible.builtin.copy:
    src: omp-route
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp-route"
    mode: "0755"

- name: Merge provider routing into OMP config
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="$HOME/.omp/agent/config.yml"
    mkdir -p "$(dirname "$cfg")"
    [ -f "$cfg" ] || : > "$cfg"
    before=$(sha256sum "$cfg")
    yq -i '. *= (load("{{ role_path }}/files/routing.yml") | explode(.) | ... comments="")' "$cfg"
    [ "$before" = "$(sha256sum "$cfg")" ] || echo changed
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
  register: omp_routing_merge
  changed_when: "'changed' in omp_routing_merge.stdout"

# ── Auth broker (`omp auth-broker`): the fleet's credential vault ───────────
# One canonical broker holds the provider logins (punjab, over the tailnet);
# every other host is a client that needs only its URL and bearer token, so no
# per-machine `/login` is required. The URL is not secret. The token comes from
# Bitwarden and is written only when the vault is unlocked, so a locked vault
# leaves any existing token untouched.
- name: Point OMP at the auth broker
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="$HOME/.omp/agent/config.yml"
    mkdir -p "$(dirname "$cfg")"
    [ -f "$cfg" ] || : > "$cfg"
    before=$(sha256sum "$cfg")
    URL='{{ omp_auth_broker_url }}' yq -i '.auth.broker.url = strenv(URL)' "$cfg"
    chmod 600 "$cfg"
    [ "$before" = "$(sha256sum "$cfg")" ] || echo changed
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
  register: omp_broker_url_set
  changed_when: "'changed' in omp_broker_url_set.stdout"
  when: omp_auth_broker_url | length > 0

- name: Fetch and write the auth broker token
  when: (omp_auth_broker_url | length > 0) and (bw_unlocked | default(false))
  environment:
    BW_SESSION: "{{ bw_session }}"
    PATH: "{{ ansible_env_path }}"
  block:
    - name: Fetch the broker bearer token from Bitwarden
      ansible.builtin.command: bw get password {{ omp_auth_broker_bw_item }}
      register: omp_broker_token
      no_log: true
      changed_when: false
      failed_when: false

    - name: Write the broker token into the OMP config
      ansible.builtin.shell: |
        set -euo pipefail
        [ -n "$TOKEN" ] || exit 0
        cfg="$HOME/.omp/agent/config.yml"
        before=$(sha256sum "$cfg")
        yq -i '.auth.broker.token = strenv(TOKEN)' "$cfg"
        chmod 600 "$cfg"
        [ "$before" = "$(sha256sum "$cfg")" ] || echo changed
      environment:
        TOKEN: "{{ omp_broker_token.stdout | default('') | trim }}"
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
      register: omp_broker_token_set
      no_log: true
      changed_when: "'changed' in omp_broker_token_set.stdout"
      when: omp_broker_token.rc == 0

- name: Check the auth broker answers
  ansible.builtin.command: omp auth-broker status
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  register: omp_broker_status
  changed_when: false
  failed_when: false
  when: omp_auth_broker_url | length > 0

- name: Report auth broker status
  ansible.builtin.debug:
    msg: >-
      omp auth-broker: {{ (omp_broker_status.stdout | default('') ~ omp_broker_status.stderr | default('')) | trim }}
      {{ '' if omp_broker_status.rc | default(1) == 0 else
         '(not healthy. With the vault unlocked, run `just seed-omp-broker` on punjab once, then `just apply-tags omp` here.)' }}
  when: omp_auth_broker_url | length > 0
