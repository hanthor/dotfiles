---
- name: Ensure installer cache exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache"
    state: directory
    mode: "0700"

- name: Check Bun availability for OMP plugins
  ansible.builtin.command: bun --version
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  register: omp_bun_version
  changed_when: false
  failed_when: false

- name: Check OMP availability
  ansible.builtin.command: omp --version
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  register: omp_version_check
  changed_when: false
  failed_when: false

- name: Download OMP installer when missing
  ansible.builtin.get_url:
    url: https://omp.sh/install
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/omp-install.sh"
    mode: "0700"
  when: omp_version_check.rc != 0

- name: Install OMP when missing
  ansible.builtin.command: sh {{ ansible_facts['env']['HOME'] }}/.cache/omp-install.sh --binary
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp"
  environment:
    PI_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  when: omp_version_check.rc != 0

- name: Download Bun installer when unavailable
  ansible.builtin.get_url:
    url: https://bun.sh/install
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/bun-install.sh"
    mode: "0700"
  when: omp_bun_version.rc != 0

- name: Install Bun for OMP plugins
  ansible.builtin.command: bash {{ ansible_facts['env']['HOME'] }}/.cache/bun-install.sh
  when: omp_bun_version.rc != 0


- name: Verify OMP is installed
  ansible.builtin.command: omp --version
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  changed_when: false

- name: Ensure OMP personal skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    state: directory
    mode: "0755"

- name: Deploy personal skills to OMP
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pi/files/skills/"
    dest: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james/"
    mode: "0644"
    directory_mode: "0755"

- name: Find skill scripts that need to be executable
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    patterns: "*.sh,*.mjs"
    recurse: true
  register: omp_skill_scripts

- name: Make skill scripts executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
  loop: "{{ omp_skill_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Ensure Claude skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory
    mode: "0755"

- name: Enumerate deployed OMP skills
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.omp/agent/skills/james"
    file_type: directory
    recurse: false
  register: omp_skill_dirs

- name: Link OMP skills into Claude's skill directory
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ omp_skill_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Check installed OMP plugins
  ansible.builtin.command: omp plugin list --json
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  register: omp_plugin_list
  changed_when: false
  failed_when: false

- name: Inspect installed OMP plugin source
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/share/omp/plugins/bun.lock"
  register: omp_plugins_lock
  changed_when: false
  failed_when: false

- name: Install Kiro provider from Hanthor fork
  ansible.builtin.command:
    cmd: omp plugin install github:hanthor/omp-kiro-provider#kiro-api-key-auth --force
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_env_path }}"
  when: >-
    omp_plugin_list.rc != 0
    or 'omp-kiro-provider' not in (omp_plugin_list.stdout | default(''))
    or 'github:hanthor/omp-kiro-provider#kiro-api-key-auth'
       not in (omp_plugins_lock.content | default('') | b64decode)

- name: Install ccleft (provider quota-remaining probe)
  ansible.builtin.command: go install github.com/tuna-os/ccleft/cmd/ccleft@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/go/bin/ccleft"
  failed_when: false


- name: Ensure OMP config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/omp"
    state: directory
    mode: "0700"
- name: Deploy omp-kiro-provider config (direct Kiro API-key auth)
  ansible.builtin.copy:
    src: kiro.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/omp/kiro.json"
    mode: "0644"

- name: Install omp-route (quota-aware omp launcher via ccleft)
  ansible.builtin.copy:
    src: omp-route
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp-route"
    mode: "0755"


- name: Deploy omp-inventory-chains (dynamic model fallback generator)
  ansible.builtin.copy:
    src: omp-inventory-chains
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp-inventory-chains"
    mode: "0755"
- name: Merge provider routing into OMP config
  ansible.builtin.shell: |
    set -eu
    cfg="$HOME/.omp/agent/config.yml"
    mkdir -p "$(dirname "$cfg")"
    [ -f "$cfg" ] || : > "$cfg"
    before=$(sha256sum "$cfg")
    yq -i '. *= (load("{{ role_path }}/files/routing.yml") | explode(.) | ... comments="")' "$cfg"
    [ "$before" = "$(sha256sum "$cfg")" ] || echo changed
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env_path }}"
  register: omp_routing_merge
  changed_when: "'changed' in omp_routing_merge.stdout"

- name: Run omp-inventory-chains to discover live models and optimize chains
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/omp-inventory-chains --update"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_env_path }}"
    OMP_AUTH_BROKER_URL: "{{ omp_auth_broker_url | default('') }}"
  failed_when: false
  changed_when: false
