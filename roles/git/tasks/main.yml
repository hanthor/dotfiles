---
- name: Deploy ~/.gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    mode: "0644"

- name: Deploy ~/.gitignore_global
  ansible.builtin.copy:
    src: gitignore_global
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitignore_global"
    mode: "0644"

- name: Deploy ~/.gitmessage commit template
  ansible.builtin.copy:
    src: gitmessage
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitmessage"
    mode: "0644"

- name: Create ~/.config/gh/ directory
  ansible.builtin.file:
    path: ~/.config/gh
    state: directory
    mode: "0755"

- name: Deploy ~/.config/gh/config.yml
  ansible.builtin.copy:
    src: gh_config.yml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/gh/config.yml"
    mode: "0644"
