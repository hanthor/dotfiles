---
# Keep the role's external contract stable while separating its internal
# lifecycle boundaries.

- name: Prepare audio platform and discover plugins
  ansible.builtin.include_tasks: platform.yml

- name: Deploy PipeWire DSP
  ansible.builtin.include_tasks: dsp.yml

- name: Configure PipeWire systemd integration
  ansible.builtin.include_tasks: systemd.yml

- name: Remove migrated audio configuration
  ansible.builtin.include_tasks: cleanup.yml
