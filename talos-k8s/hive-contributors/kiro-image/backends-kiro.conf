# backends-kiro.conf — appended to the base image's backends.conf.
#
# Redefines backend_binary and backend_perm_flag so a `kiro` backend resolves to
# the kiro-hive wrapper (which execs `kiro-cli chat`) and launches unattended.
# Because this file is concatenated AFTER the base definitions, these shell
# functions SHADOW the base ones (later definitions win in bash) while
# delegating every other backend back to the original behavior via the saved
# copies below.

# Save the base implementations under new names so we can fall through to them.
eval "$(declare -f backend_binary    | sed '1s/backend_binary/__base_backend_binary/')"
eval "$(declare -f backend_perm_flag | sed '1s/backend_perm_flag/__base_backend_perm_flag/')"

backend_binary() {
  case "$1" in
    # kiro-hive execs `kiro-cli chat "$@"` — see the wrapper in the image.
    kiro) echo "kiro-hive" ;;
    *)    __base_backend_binary "$1" ;;
  esac
}

backend_perm_flag() {
  case "$1" in
    # --trust-all-tools grants tool permissions upfront: there is no operator to
    # approve tool calls on an unattended pane. (Kiro docs: headless usage.)
    kiro) echo "--trust-all-tools" ;;
    *)    __base_backend_perm_flag "$1" ;;
  esac
}

# Add kiro to the advertised backend list so agent-launch.sh's "Unknown backend"
# guard and any KNOWN_BACKENDS check accept it.
KNOWN_BACKENDS="${KNOWN_BACKENDS} kiro"
