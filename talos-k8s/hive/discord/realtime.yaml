# Hive ops bridge: GitHub webhook receiver (feeds /data/github-events.jsonl for
# report.py) + optional quiet #hive-ops feed. Exported from the live cluster
# 2026-09-24; REALTIME_* knobs added (defaults match the code).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: realtime
    app.kubernetes.io/name: hive-discord-reports
  name: hive-discord-realtime
  namespace: hive
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-discord-realtime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-discord-realtime
    spec:
      containers:
        - command:
            - python
            - /app/realtime.py
          env:
            - name: HIVE_DASHBOARD_URL
              value: http://hive:3002
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HIVE_DASHBOARD_TOKEN
                  name: hive-secrets
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: DISCORD_BOT_TOKEN
                  name: discord-report-secrets
            - name: DISCORD_HIVE_OPS_CHANNEL
              value: "1542297363908001802"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_WEBHOOK_SECRET
                  name: discord-report-secrets
            - name: GITHUB_EVENT_LOG
              value: /data/github-events.jsonl
            - name: DISCORD_REALTIME_POSTS
              value: "false"
            - name: REALTIME_BATCH_SECONDS
              value: "60"
            - name: REALTIME_SLOW_BATCH_SECONDS
              value: "10800"
            - name: REALTIME_MAX_POSTS_PER_HOUR
              value: "6"
            - name: REALTIME_CI_FAIL_STREAK
              value: "2"
            - name: REALTIME_BEAD_POLL
              value: "false"
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          name: bridge
          ports:
            - containerPort: 8080
              name: webhook
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app
              name: code
              readOnly: true
            - mountPath: /data
              name: data
      dnsPolicy: ClusterFirst
      nodeSelector:
        workload-role: hive
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 365
            name: discord-realtime-code
          name: code
        - name: data
          persistentVolumeClaim:
            claimName: discord-reports-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: realtime
    app.kubernetes.io/name: hive-discord-reports
  name: hive-discord-realtime-webhook
  namespace: hive
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: webhook
      port: 8080
      protocol: TCP
      targetPort: webhook
  selector:
    app.kubernetes.io/name: hive-discord-realtime
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-reports-data
  namespace: hive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
  volumeMode: Filesystem
