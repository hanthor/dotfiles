# Hourly build-cache janitor for the hive contributor home PVCs (ns hive-contributors).
#
# Contributors clone a fresh checkout per PR under workspace/<org>/<repo>-<n> and
# never clean up: Rust target/ dirs reached 82 GiB in claude-home and filled the
# hive node (2026-10-02), evicting ~6.5k pods incl. Traefik and Matrix. local-path
# does not enforce the PVC size. Only regenerable build output is removed:
# target/ dirs untouched for 2 days and go-build cache entries older than 7 days;
# when the home is over 30 GiB, target/ dirs idle for an hour go too (a single
# spindle debug build reached 74 GiB in a day, 2026-10-03). Runs at
# system-node-critical: the kubelet rejects ordinary pods while the node is in
# DiskPressure, which is exactly when this has to run.
# One CronJob per PVC so each pod lands on the PVC's node (local-path is node-bound).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: janitor-claude-home
  namespace: hive-contributors
  labels: {app.kubernetes.io/name: contributor-janitor}
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels: {app.kubernetes.io/name: contributor-janitor}
        spec:
          restartPolicy: Never
          priorityClassName: system-node-critical
          # Same identity as the contributor pods (uid/gid 1000), which own these files;
          # the namespace enforces PodSecurity "restricted".
          securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
            - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
          volumes:
            - {name: home, persistentVolumeClaim: {claimName: claude-home}}
          containers:
            - name: janitor
              image: alpine:3.24
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi}
                limits: {memory: 256Mi}
              volumeMounts: [{name: home, mountPath: /home}]
              command:
                - sh
                - -c
                - |
                  cd /home || exit 1
                  df -h . | tail -1
                  idle=2880
                  [ "$(du -xsm . | cut -f1)" -gt 30720 ] && idle=60
                  for t in workspace/*/*/target; do
                    [ -d "$t" ] || continue
                    [ -n "$(find "$t" -maxdepth 2 -mmin -$idle -print -quit)" ] && continue
                    echo "rm $t $(du -xsh "$t" | cut -f1)"; rm -rf "$t"
                  done
                  [ -d .cache/go-build ] && find .cache/go-build -type f -mtime +7 -delete
                  df -h . | tail -1
