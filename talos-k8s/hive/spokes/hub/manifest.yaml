# Spoke 'hub' (namespace hive-hub), exported from the AWS Talos cluster on 2026-10-01.
# Secrets are NOT here (hive-secrets etc. are created out of band).
# The hive container image is owned by the hive-operator HiveRelease controller;
# see ../README.md before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hive.tunaos.org/previous-image: ghcr.io/hivecommons/hive-hub:v5.96.3@sha256:d253ce0285c9f79a648b91f183a01592a79dab014e30d5943c736989f74a3ea5
    hive.tunaos.org/previous-version: v5.96.3
    hive.tunaos.org/upgraded-at: "2026-10-01T09:03:11Z"
    hive.tunaos.org/version: v5.105.10
  labels:
    app.kubernetes.io/name: hive-hub
  name: hive-hub
  namespace: hive-hub
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-hub
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: hive-hub
    spec:
      containers:
        - args:
            - --config
            - /etc/hive/hive.yaml
          env:
            - name: HIVE_MODE
              value: hub
            - name: HIVE_HUB_PORT
              value: "3001"
            - name: HIVE_HUB_SECRET
              valueFrom:
                secretKeyRef:
                  key: HIVE_HUB_SECRET
                  name: hive-hub-secrets
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HIVE_DASHBOARD_TOKEN
                  name: hive-hub-secrets
          image: ghcr.io/hivecommons/hive-hub:v5.105.10@sha256:797b4035b2bc9f9f3b6f344ce60cb7a5b3c6d638fa4988f6bdf2d7f12889db8a
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: hub
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/hive
              name: config
              readOnly: true
            - mountPath: /data
              name: data
            - mountPath: /secrets
              name: secrets
              readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        workload-role: hive
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 420
            name: hive-hub-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: hive-hub-data
        - name: secrets
          secret:
            defaultMode: 288
            optional: true
            secretName: hive-secrets-hub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hub-front
  name: hub-front
  namespace: hive-hub
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-front
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: hub-front
    spec:
      containers:
        - image: docker.io/library/nginx:1.27-alpine-slim
          imagePullPolicy: IfNotPresent
          name: web
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 24Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: site
              readOnly: true
            - mountPath: /etc/nginx/conf.d
              name: conf
            - mountPath: /var/cache/nginx
              name: cache
            - mountPath: /var/run
              name: run
      dnsPolicy: ClusterFirst
      nodeSelector:
        workload-role: hive
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 420
            name: hub-front
          name: site
        - configMap:
            defaultMode: 420
            name: hub-front-nginx
          name: conf
        - emptyDir: {}
          name: cache
        - emptyDir: {}
          name: run
---
apiVersion: v1
kind: Service
metadata:
  name: hive-hub
  namespace: hive-hub
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 3001
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: hive-hub
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hub-front
  namespace: hive-hub
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: hub-front
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: hive-hub
  namespace: hive-hub
spec:
  ingressClassName: traefik
  rules:
    - host: hub.tunaos.org
      http:
        paths:
          - backend:
              service:
                name: hive-hub
                port:
                  number: 3001
            path: /api
            pathType: Prefix
          - backend:
              service:
                name: hive-hub
                port:
                  number: 3001
            path: /login
            pathType: Prefix
          - backend:
              service:
                name: hub-front
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - hub.tunaos.org
      secretName: hub-tunaos-org-tls
---
apiVersion: v1
data:
  hive.yaml: |
    # The hub still reads hive.yaml and still validates the project/github
    # blocks, so a minimal seed is required even though the hub runs no agents.
    project:
      org: tuna-os
      name: TunaOS
      repos:
        - tunaOS
      primary_repo: tunaOS
      ai_author: hanthor

    github:
      app_id: 3942065
      installation_id: 137498420
      key_file: /secrets/gh-app-key.pem

    hub:
      enabled: true
      url: https://hub.tunaos.org

    dashboard:
      port: 3001
kind: ConfigMap
metadata:
  name: hive-hub-config
  namespace: hive-hub
---
apiVersion: v1
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      location / { try_files $uri $uri/ /index.html; }
    }
kind: ConfigMap
metadata:
  name: hub-front-nginx
  namespace: hive-hub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  finalizers:
    - kubernetes.io/pvc-protection
  name: hive-hub-data
  namespace: hive-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
  volumeMode: Filesystem
