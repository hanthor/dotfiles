      port: 3001
      protocol: TCP
      targetPort: dashboard
    - name: api
      port: 3002
      protocol: TCP
      targetPort: dashboard
    - name: ttyd
      port: 7681
      protocol: TCP
      targetPort: ttyd
  selector:
    app.kubernetes.io/name: hive
  sessionAffinity: None
  type: ClusterIP
---
