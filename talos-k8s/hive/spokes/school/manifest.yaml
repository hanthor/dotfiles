# Spoke 'school' (namespace hive), exported from the AWS Talos cluster on 2026-10-01.
# Secrets are NOT here (hive-secrets etc. are created out of band).
# The hive container image is owned by the hive-operator HiveRelease controller;
# see ../README.md before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hive.tunaos.org/previous-image: ghcr.io/hivecommons/hive:v5.105.10@sha256:6bcfc09e7fcfd10ca128d4ac7f9c41bea44bb32e4f92d088812e7892a9762de0
    hive.tunaos.org/previous-version: v5.105.10
    hive.tunaos.org/upgraded-at: "2026-10-01T14:08:19Z"
    hive.tunaos.org/version: v6-459e63d58696
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: hive
  name: hive
  namespace: hive
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: hive
    spec:
      containers:
        - args:
            - --config
            - /etc/hive/hive.yaml
          env:
            - name: META_API_KEY
              valueFrom:
                secretKeyRef:
                  key: META_API_KEY
                  name: hive-secrets
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HIVE_DASHBOARD_TOKEN
                  name: hive-secrets
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: DEEPSEEK_API_KEY
                  name: hive-secrets
            - name: HIVE_HUB_URL
              value: https://hub.tunaos.org
            - name: HIVE_HUB_SECRET
              valueFrom:
                secretKeyRef:
                  key: HIVE_HUB_SECRET
                  name: hive-secrets
                  optional: true
            - name: GH_APP_ID
              value: "3942065"
            - name: GH_APP_INSTALLATION_ID
              value: "137498420"
            - name: GH_APP_KEY_FILE
              value: /secrets/gh-app-key.pem
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  key: NTFY_TOPIC
                  name: hive-secrets
                  optional: true
            - name: KIRO_API_KEY
              valueFrom:
                secretKeyRef:
                  key: KIRO_API_KEY
                  name: kiro-api
                  optional: true
          image: ghcr.io/hivecommons/hive:v6-latest@sha256:740779e95a407ff2b1e80932b5ff4d7a88be8927bad05023a23be0f5f4b82e2c
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/livez
              port: dashboard
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: hive
          ports:
            - containerPort: 3002
              name: dashboard
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: dashboard
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 300m
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SETUID
                - SETGID
                - SETPCAP
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: dashboard
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/hive
              name: config
              readOnly: true
            - mountPath: /data
              name: data
            - mountPath: /secrets
              name: secrets
              readOnly: true
            - mountPath: /shared-auth
              name: sharedauth
            - mountPath: /data/home/.claude
              name: sc
            - mountPath: /data/home/.gemini
              name: sg
            - mountPath: /data/home/.codex
              name: scx
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: ghcr-auth
      nodeSelector:
        workload-role: hive
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1002
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 420
            name: hive-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
        - name: secrets
          secret:
            defaultMode: 288
            optional: true
            secretName: hive-secrets
        - name: shared-auth
          persistentVolumeClaim:
            claimName: hive-shared-auth
        - name: sharedauth
          persistentVolumeClaim:
            claimName: hive-shared-auth
        - name: sc
          persistentVolumeClaim:
            claimName: shared-claude
        - name: sg
          persistentVolumeClaim:
            claimName: shared-gemini
        - name: scx
          persistentVolumeClaim:
            claimName: shared-codex
---
