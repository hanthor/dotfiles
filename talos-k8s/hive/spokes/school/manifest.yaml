      name: hive
      port:
        number: 3001
  ingressClassName: tailscale
  tls:
    - hosts:
        - hive
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: hive-public
  namespace: hive
spec:
  ingressClassName: traefik
  rules:
    - host: hive.tunaos.org
      http:
        paths:
          - backend:
              service:
                name: hive-discord-realtime-webhook
                port:
                  number: 8080
            path: /api/discord-reports/github
            pathType: Prefix
          - backend:
              service:
                name: hive
                port:
                  number: 3002
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - hive.tunaos.org
      secretName: hive-tunaos-org-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: hive-school
  namespace: hive
spec:
  ingressClassName: traefik
