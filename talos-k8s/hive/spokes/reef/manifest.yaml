# Spoke 'reef' (namespace hive-reef), exported from the AWS Talos cluster on 2026-10-01.
# Secrets are NOT here (hive-secrets etc. are created out of band).
# The hive container image is owned by the hive-operator HiveRelease controller;
# see ../README.md before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hive.tunaos.org/previous-image: ghcr.io/hivecommons/hive:v5.105.10@sha256:6bcfc09e7fcfd10ca128d4ac7f9c41bea44bb32e4f92d088812e7892a9762de0
    hive.tunaos.org/previous-version: v5.105.10
    hive.tunaos.org/upgraded-at: "2026-10-01T14:06:10Z"
    hive.tunaos.org/version: v6-459e63d58696
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: hive
  name: hive
  namespace: hive-reef
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: hive
    spec:
      containers:
        - args:
            - --config
            - /etc/hive/hive.yaml
          env:
            - name: META_API_KEY
              valueFrom:
                secretKeyRef:
                  key: META_API_KEY
                  name: hive-secrets
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: HIVE_DASHBOARD_TOKEN
                  name: hive-secrets
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: DEEPSEEK_API_KEY
                  name: hive-secrets
            - name: HIVE_HUB_SECRET
              valueFrom:
                secretKeyRef:
                  key: HIVE_HUB_SECRET
                  name: hive-secrets
                  optional: true
            - name: GH_APP_ID
              value: "3942065"
            - name: GH_APP_INSTALLATION_ID
              value: "137498420"
            - name: GH_APP_KEY_FILE
              value: /secrets/gh-app-key.pem
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  key: NTFY_TOPIC
                  name: hive-secrets
                  optional: true
            - name: HIVE_HUB_URL
              value: https://hub.tunaos.org
            - name: KIRO_API_KEY
              valueFrom:
                secretKeyRef:
                  key: KIRO_API_KEY
                  name: kiro-api
                  optional: true
          image: ghcr.io/hivecommons/hive:v6-latest@sha256:f33662b37d2abf51816b81a04c05bfaba1ae63e38da8d062105d0e3283f23b16
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/livez
              port: dashboard
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: hive
          ports:
            - containerPort: 3002
              name: dashboard
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: dashboard
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 300m
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SETUID
                - SETGID
                - SETPCAP
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: dashboard
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/hive
              name: config
            - mountPath: /data
              name: data
            - mountPath: /secrets
              name: secrets
              readOnly: true
            - mountPath: /data/home/.claude
              name: sc
            - mountPath: /data/home/.gemini
              name: sg
            - mountPath: /data/home/.codex
              name: scx
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: ghcr-auth
      nodeSelector:
        workload-role: hive
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1002
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 420
            name: hive-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
        - name: secrets
          secret:
            defaultMode: 288
            optional: true
            secretName: hive-secrets
        - name: sc
          persistentVolumeClaim:
            claimName: shared-claude
        - name: sg
          persistentVolumeClaim:
            claimName: shared-gemini
        - name: scx
          persistentVolumeClaim:
            claimName: shared-codex
---
apiVersion: v1
kind: Service
metadata:
  name: hive
  namespace: hive-reef
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: dashboard
      port: 3002
      protocol: TCP
      targetPort: dashboard
  selector:
    app.kubernetes.io/name: hive
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: hive-reef-public
  namespace: hive-reef
spec:
  ingressClassName: traefik
  rules:
    - host: reef.tunaos.org
      http:
        paths:
          - backend:
              service:
                name: hive
                port:
                  number: 3002
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - reef.tunaos.org
      secretName: reef-tunaos-org-tls
---
apiVersion: v1
data:
  hive.yaml: |
    # reef — the applications hive. Desktop apps and their distribution.
    #
    # Split from the tunaos hive so the two fleets stop competing over
    # unrelated work: an agent triaging a GTK app should not be ranking bootc
    # installer issues against it.
    #
    # ACMM L5, not L6, and a DELIBERATELY SMALL roster. Two reasons:
    #   - Quota, not compute, is the binding constraint. deepseek is dry,
    #     openai is capped, anthropic is near its weekly cap, and google is
    #     carrying the fleet. A second full 11-agent L6 fleet would halve the
    #     work each hive gets done, not double it.
    #   - L5 holds every PR behind a `hold` label. A newly split hive should
    #     earn auto-merge rather than start with it.
    # Raise the level once the split has settled and there is quota to spend.
    # NOTE: no checked-in manifest for this hive was found (checked 2026-09-27);
    # this ConfigMap is hand-managed. 2026-09-27: dropped archived tuna-os/letters.
    acmm_level: 5
    project:
      org: tuna-os
      name: reef
      repos:
        - .github
        - Tavern
        - bluefin-cli
        - blueshell
        - corral
        - docs
        - dualcut
        - flatpak-index
        - gnome-hive-monitor
        - gtk-office-suite
        - hive
        - mandelbrot
        - mariner
        - protota
        - spindle
        - suite-common
        - suite-common-rust
      ai_author: hanthor
      primary_repo: gtk-office-suite

    hub:
      enabled: true
      url: https://hub.tunaos.org

    agents:
      supervisor:
        enabled: true
        backend: agy
        model: gemini-3.8-flash-low
        beads_dir: /data/beads/supervisor
        clear_on_kick: false
        caveman_mode: full
      scanner:
        enabled: true
        backend: agy
        model: gemini-3.8-flash-low
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/scanner
        caveman_mode: full
      quality:
        enabled: true
        backend: agy
        model: gemini-3.8-flash-low
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/quality
        caveman_mode: full
      guide:
        enabled: true
        backend: agy
        model: gemini-3.8-flash-low
        beads_dir: /data/beads/guide
        clear_on_kick: false
        caveman_mode: full

    governor:
      eval_interval_s: 300
      modes:
        surge:
          threshold: 70
          supervisor: 10m
          scanner: 30m
          quality: 1h
          guide: 2h
        busy:
          threshold: 10
          supervisor: 15m
          scanner: 1h
          quality: 2h
          guide: 4h
        quiet:
          threshold: 2
          supervisor: 30m
          scanner: 2h
          quality: 4h
          guide: 6h
        idle:
          threshold: 0
          supervisor: 1h
          scanner: 4h
          quality: 6h
          guide: 8h

    github:
      app_id: 3942065
      installation_id: 137498420
      key_file: /secrets/gh-app-key.pem

    dashboard:
      port: 3002
kind: ConfigMap
metadata:
  name: hive-config
  namespace: hive-reef
---
apiVersion: v1
data:
  custom.css: "/* TunaOS branding override for the hive dashboard.\n *\n * Served at /branding/custom.css by the operator-branding hook\n * (kubestellar/hive#5690) and linked last in <head>, so these win the cascade\n * without !important.\n *\n * TOKEN NAMES ARE READ FROM THE SHIPPED DOCUMENT, NOT GUESSED. An earlier\n * version invented plausible names (--text-primary, --surface-1, …) and\n * changed nothing at all. The dashboard's actual custom properties are --bg,\n * --bg-soft, --surface, --panel, --panel-strong, --card-bg, --line,\n * --line-strong, --border, --fg, --text, --muted, --accent plus a named colour\n * ramp.\n *\n * BOTH THEMES ARE OVERRIDDEN, and that is load-bearing. `:root` carries the\n * DARK palette and `body.light-mode` overrides it for light — so styling only\n * `:root` is silently discarded whenever the operator is in light mode, which\n * is exactly how the first attempt failed. Light mode gets its own aquatic\n * palette rather than a dark one forced into it.\n *\n * Scoped to COLOUR TOKENS only. The dashboard is one embedded SPA whose markup\n * changes between releases; restyling structure here would break on upgrade,\n * whereas custom properties are the surface intended to be re-pointed.\n */\n\n/* ── Dark: deep water ─────────────────────────────────────────────────── */\n:root {\n  --bg:            #04161f;\n  --bg-soft:       #07202b;\n  --surface:       #0a2430;\n  --panel:         #0a2430;\n  --panel-strong:  #0d2c3a;\n  --card-bg:       #0a2430;\n  --terminal-bg:   #020d13;\n\n  --line:          #12394a;\n  --line-strong:   #1b4d63;\n  --border:        #12394a;\n\n  --fg:            #e8f6f8;\n  --text:          #e8f6f8;\n  --muted:         #8fb3bd;\n  --terminal-fg:   #e8f6f8;\n  --terminal-muted:#8fb3bd;\n\n  --accent:        #2fb6c4;   /* tuna-fin cyan */\n  --oc-accent:     #2fb6c4;\n  --oc-accent-light:#7fd6df;\n  --cyan:          #2fb6c4;\n  --terminal-cyan: #2fb6c4;\n\n  /* Status stays distinct from the brand hue: a green that matches the accent\n   * stops reading as \"healthy\" and starts reading as \"branded\". */\n  --green:         #3fbf8f;\n  --green-bg:      #0c2f26;\n  --green-border:  #1d5a47;\n  --red:           #f2795b;\n  --red-bg:        #33150f;\n  --red-border:    #6b2b1d;\n  --orange:        #e0a33a;\n  --amber:         #e0a33a;\n  --yellow:        #e0c23a;\n  --blue:          #4aa8d8;\n  --indigo:        #6f8fd8;\n  --purple:        #a98fd8;\n}\n\n/* ── Light: shallow water ─────────────────────────────────────────────── */\nbody.light-mode {\n  --bg:            #f2f9fa;\n  --bg-soft:       #ffffff;\n  --surface:       #ffffff;\n  --panel:         #ffffff;\n  --panel-strong:  #e7f2f5;\n  --card-bg:       #ffffff;\n\n  --line:          #cbdfe5;\n  --line-strong:   #a8c9d2;\n  --border:        #cbdfe5;\n\n  --fg:            #06232e;\n  --text:          #06232e;\n  --muted:         #4d7683;\n\n  /* Darkened from the dark-mode cyan so it still clears contrast on white:\n   * #2fb6c4 on #ffffff is only ~2.2:1 and fails as text. */\n  --accent:        #10707c;\n  --oc-accent:     #10707c;\n  --oc-accent-light:#2fb6c4;\n  --cyan:          #10707c;\n\n  --green:         #1d7a5c;\n  --green-bg:      #e4f5ee;\n  --green-border:  #a9dcc9;\n  --red:           #c1442a;\n  --red-bg:        #fbe9e4;\n  --red-border:    #edb9a9;\n  --orange:        #a9741a;\n  --amber:         #a9741a;\n  --yellow:        #8a7413;\n  --blue:          #1f6f96;\n}\n\n/* ── reef identity ────────────────────────────────────────────────── */\n/* Replaces the upstream bee/HIVE wordmark. See make-branding.py for why this\n   is done with pseudo-elements and what it deliberately cannot reach. */\n.oc-logo-icon { font-size: 0 !important; }\n.oc-logo-icon::after { content: \"\U0001FAB8\"; font-size: 26px; line-height: 1; }\n\n.oc-logo-title { font-size: 0 !important; }\n.oc-logo-title::after {\n  content: \"REEF\";\n  font-size: 20px; font-weight: 800; letter-spacing: .06em; color: var(--accent);\n}\n\n.oc-logo-sub { font-size: 0 !important; }\n.oc-logo-sub::after {\n  content: \"APPLICATIONS\";\n  font-size: 10px; font-weight: 700; letter-spacing: .11em; color: var(--muted);\n}\n\nh1 .bee { font-size: 0 !important; }\nh1 .bee::after { content: \"\U0001FAB8\"; font-size: 1rem; line-height: 1; }\n"
kind: ConfigMap
metadata:
  name: hive-branding
  namespace: hive-reef
