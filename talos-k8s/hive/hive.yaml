# Hive v2 Configuration — TunaOS project, goose + DeepSeek backend
# Deploy: kubectl apply -f hive.yaml && kubectl rollout restart deploy/hive -n hive
#
# Secrets (create before deploy):
#   kubectl create secret generic hive-secrets -n hive \
#     --from-literal=DEEPSEEK_API_KEY=sk-... \
#     --from-literal=HIVE_GITHUB_TOKEN=... \
#     --from-literal=NTFY_TOPIC=your-topic \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For GitHub App auth (preferred):
#   kubectl create secret generic hive-secrets -n hive \
#     --from-literal=GH_APP_ID=3942065 \
#     --from-literal=GH_APP_INSTALLATION_ID=137498420 \
#     --from-file=gh-app-key.pem=/path/to/key.pem \
#     --from-literal=NTFY_TOPIC=your-topic \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/part-of: hive
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-config
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
data:
  hive.yaml: |
    # ACMM L6 "Fully Autonomous" — full agent pack, auto-merge with guardrails
    acmm_level: 6
    project:
      org: tuna-os
      name: TunaOS
      repos:
        - tuna-os/tunaos
        - tuna-os/tromso
        - tuna-os/tacklebox
        - tuna-os/docs
        - tuna-os/xfce-linux
        - tuna-os/ubuntu
        - tuna-os/github-copr
        - tuna-os/bluefin-cli
        - tuna-os/.github
        - tuna-os/Tavern
        - tuna-os/corral
        - tuna-os/letters
        - tuna-os/flatpak-index
        - tuna-os/hive
      ai_author: hanthor
      primary_repo: tuna-os/tunaos

    # tuna-os/hive is this hive's own fork of kubestellar/hive (transferred
    # from hanthor/hive 2026-09-02 so the existing GH App installation, which
    # is tuna-os-org-scoped, covers it — the App has no installation on
    # personal accounts, and hive.yaml supports exactly one installation_id
    # per project, so a cross-owner repo would silently fail auth the same
    # way operations/telemetry silently failed on copilot). Runs at the same
    # ACMM L6 as every other managed repo, so scanner/ci-maintainer/quality/
    # guide/sec-check/architect/strategist/outreach can open PRs here too —
    # the safety net is GitHub-side, not ACMM-side: branch protection on `v4`
    # requires 1 approving review with enforce_admins:true, so nothing merges
    # (auto-merge included) without a human, even though the bot has admin
    # access to the repo.

    # ACMM level set explicitly in agent config; packs override backends to copilot

    agents:
      supervisor:
        enabled: true
        backend: pi
        model: deepseek-v4-pro
        beads_dir: /data/beads/supervisor
        clear_on_kick: false
        bead_role: supervisor
        caveman_mode: full
      scanner:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/scanner
        clear_on_kick: false
        caveman_mode: full
      ci-maintainer:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/ci-maintainer
        clear_on_kick: false
        caveman_mode: full
      quality:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/quality
        clear_on_kick: false
        caveman_mode: full
      guide:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        beads_dir: /data/beads/guide
        clear_on_kick: false
        caveman_mode: full
      sec-check:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/sec-check
        clear_on_kick: false
        caveman_mode: full
      architect:
        enabled: true
        backend: pi
        model: deepseek-v4-pro
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/architect
        clear_on_kick: false
        caveman_mode: full
      strategist:
        enabled: true
        backend: pi
        model: deepseek-v4-pro
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/strategist
        clear_on_kick: false
        caveman_mode: full
      outreach:
        enabled: true
        backend: pi
        model: deepseek-v4-flash
        mode: ISSUES_AND_PRS
        beads_dir: /data/beads/outreach
        clear_on_kick: false
        caveman_mode: full
      brainstorm:
        enabled: false

    # Knowledge system: bead-to-wiki synthesizer, vaults, document sources
    knowledge:
      enabled: true
      git_sources:
        - name: tunaos-docs
          url: https://github.com/tuna-os/docs.git
          branch: main
          layer: project
        - name: tunaos-tunaos
          url: https://github.com/tuna-os/tunaos.git
          branch: main
          layer: project
        - name: dotfiles-docs
          url: https://github.com/hanthor/dotfiles.git
          branch: master
          subpath: docs/src
          layer: project
        - name: dotfiles-hive
          url: https://github.com/hanthor/dotfiles.git
          branch: master
          subpath: talos-k8s/hive
          layer: project
      vaults:
        - name: bead-synth-wiki
          path: /data/vaults/bead-synth-wiki
          auto_index: true
      bead_synthesizer:
        enabled: true
        schedule: hourly
        min_confidence: 0.5
        target_layer: project
        max_facts_per_cycle: 20
        vault_path: /data/vaults/bead-synth-wiki
        retention_policy:
          max_beads: 5000
          archive_after_synth_days: 30
          high_priority_retain_days: 90
          preserve_with_deps: true

    governor:
      eval_interval_s: 300
      modes:
        surge:
          threshold: 70
          supervisor: 5m
          scanner: 15m
          ci-maintainer: pause
          quality: 1h
          guide: 1h
          architect: 2h
          strategist: 2h
          sec-check: 1h
          outreach: 2h
        busy:
          threshold: 10
          supervisor: 5m
          scanner: 15m
          ci-maintainer: 1h
          quality: 2h
          guide: 2h
          architect: 4h
          strategist: 4h
          sec-check: 2h
          outreach: 4h
        quiet:
          threshold: 2
          supervisor: 10m
          scanner: 15m
          ci-maintainer: 45m
          quality: 4h
          guide: 4h
          architect: 6h
          strategist: 6h
          sec-check: 4h
          outreach: 6h
        idle:
          threshold: 0
          supervisor: 15m
          scanner: 15m
          ci-maintainer: 15m
          quality: 6h
          guide: 6h
          architect: 8h
          strategist: 8h
          sec-check: 6h
          outreach: 8h

    github:
      app_id: 3942065
      installation_id: 137498420
      key_file: /var/run/hive-metrics/gh-app-key.pem

    dashboard:
      port: 3002

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-data
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/component: controller
    spec:
      nodeSelector:
        workload-role: hive
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        fsGroup: 1002
      containers:
        - name: hive
          image: ghcr.io/kubestellar/hive:stable
          imagePullPolicy: Always
          args:
            - "--config"
            - "/etc/hive/hive.yaml"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - SETUID
                - SETGID
                - SETPCAP
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
          ports:
            - name: dashboard
              containerPort: 3002
              protocol: TCP
          env:
            # Dashboard token for proxy auth
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_DASHBOARD_TOKEN
                  optional: true
            # DeepSeek API key for agents
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: DEEPSEEK_API_KEY
            # GitHub App auth
            # Point this spoke at the tuna-os hub and authenticate its
            # heartbeats. Heartbeats to hive.kubestellar.io return 401 by
            # design (unauthenticated self-host registration was removed
            # upstream, #1077); with our own hub we ARE the operator that
            # issues the secret, so registration works.
            - name: HIVE_HUB_URL
              value: https://hub.tunaos.org
            - name: HIVE_HUB_SECRET
              valueFrom:
                secretKeyRef: {name: hive-secrets, key: HIVE_HUB_SECRET, optional: true}
            - name: GH_APP_ID
              value: "3942065"
            - name: GH_APP_INSTALLATION_ID
              value: "137498420"
            - name: GH_APP_KEY_FILE
              value: /secrets/gh-app-key.pem
            # ntfy notifications
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: NTFY_TOPIC
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/hive
              readOnly: true
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /secrets
              readOnly: true
            # ONE shared Claude/Gemini credential store for the whole fleet.
            # /data/home/.claude and /data/home/.gemini are SYMLINKS on the
            # hive-data PVC pointing here, so a single device-flow login covers
            # hive, hive-reef, hive-hanthor and hive-contributors instead of one
            # per spoke. Remove this mount and those symlinks dangle.
            #
            # Mounted plainly, NOT via hostPath or subPath. reef/hanthor reach
            # the same directory through hostPath PVs, but on this node that
            # path resolves to a different filesystem for a freshly-created
            # mount (reef sees device 0:66, a new hostPath mount lands on 0:59
            # and silently gets an empty directory). Verified by write-through
            # test, 2026-09-06.
            - name: sharedauth
              mountPath: /shared-auth
          startupProbe:
            httpGet:
              path: /api/health
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/livez
              port: dashboard
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: hive-config
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
        - name: secrets
          secret:
            secretName: hive-secrets
            optional: true
            defaultMode: 0440
        - name: sharedauth
          persistentVolumeClaim:
            claimName: hive-shared-auth
---
apiVersion: v1
kind: Service
metadata:
  name: hive
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hive
  ports:
    - name: dashboard
      port: 3002
      targetPort: dashboard
      protocol: TCP
---
# Tailscale Ingress — hive.manatee-basking.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hive
  namespace: hive
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hive
      port:
        number: 3002
  tls:
    - hosts:
        - hive
