# hive-ops CronJobs (ns hive). Exported from the AWS cluster and cleaned of
# status/managed fields. Apply with: kubectl apply -f cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: activity
    app.kubernetes.io/name: hive-ops
  name: hive-activity
  namespace: hive
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: activity
            app.kubernetes.io/name: hive-ops
        spec:
          containers:
          - command:
            - bash
            - /scripts/hive-activity.sh
            - publish
            env:
            - name: KUBECONFIG
            - name: HIVE_ACTIVITY_STATE
              value: /state/hive-activity
            - name: HOME
              value: /tmp
            image: alpine/k8s:1.31.0
            imagePullPolicy: IfNotPresent
            name: ops
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /scripts
              name: scripts
              readOnly: true
            - mountPath: /state
              name: state
            - mountPath: /tmp
              name: tmp
          dnsPolicy: ClusterFirst
          nodeSelector:
            workload-role: hive
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          serviceAccount: hive-ops
          serviceAccountName: hive-ops
          terminationGracePeriodSeconds: 30
          tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Exists
          volumes:
          - configMap:
              defaultMode: 493
              name: hive-ops-scripts
            name: scripts
          - name: state
            persistentVolumeClaim:
              claimName: hive-ops-state
          - emptyDir: {}
            name: tmp
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  suspend: false
---
