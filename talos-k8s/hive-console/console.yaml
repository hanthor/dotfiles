# hive-console — fleet status + agent control, served at
# https://hive.tunaos.org/console
#
# Deploy (the ConfigMap holding app.py is generated from the file, so the
# Python stays readable/lintable in git rather than embedded in YAML):
#
#   export KUBECONFIG=~/.kube/config-aws-migration
#   kubectl create configmap hive-console-app -n hive \
#     --from-file=app.py=talos-k8s/hive-console/app.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f talos-k8s/hive-console/console.yaml
#   kubectl rollout restart deploy/hive-console -n hive   # after an app.py change
#
# NAMESPACE + NODE ARE NOT INCIDENTAL. The pod mounts the hive PVC read-only;
# a PVC can only be mounted from its own namespace, and an RWO volume binds to
# ONE NODE (several pods on that node may share it). Hence namespace `hive`,
# hive's nodeSelector, and hive's control-plane toleration. Move either and the
# pod will sit in Pending with a volume-node-affinity conflict.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-console
  namespace: hive
---
# Least privilege: the console only ever LISTS contributor pods. Everything
# else it does goes through hive's own API, which enforces its own authz.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-console-contrib-read
  namespace: hive-contributors
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-console-contrib-read
  namespace: hive-contributors
subjects:
  - kind: ServiceAccount
    name: hive-console
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-console-contrib-read
---
# Read the provider-usage ConfigMap that hive-rotate.sh publishes (google and
# openai headroom is only readable by driving their CLI in a tmux pane, which
# this pod cannot do — so it displays what the rotation timer measured, with
# the age of that measurement shown).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-console-usage-read
  namespace: hive
rules:
  - apiGroups: [""]
    resources: [configmaps]
    # hive-activity-series carries the daily PR/issue counts hive-metrics.sh
    # collects; the console only ever reads them.
    resourceNames: [hive-provider-usage, hive-activity-series]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-console-usage-read
  namespace: hive
subjects:
  - kind: ServiceAccount
    name: hive-console
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-console-usage-read
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-console
  namespace: hive
  labels:
    app.kubernetes.io/name: hive-console
spec:
  replicas: 1
  strategy:
    type: Recreate      # shares hive's RWO volume; no two-pod overlap
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-console
      annotations:
        # Roll the pod whenever app.py changes; without this, `kubectl apply`
        # of a new ConfigMap leaves the old code running until a manual restart.
        checksum/app: "REPLACED_AT_DEPLOY"
    spec:
      serviceAccountName: hive-console
      nodeSelector:
        workload-role: hive
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # uid 1001 / gid 1000 mirrors hive's own `dev:node` ownership on the PVC.
      # It is not cosmetic: dashboard-sessions.json is mode 0600 owned by 1001,
      # so ANY other uid gets EPERM and every request 401s even with a valid
      # cookie (observed). The Claude credentials file is 0660 dev:node, which
      # gid 1000 covers. The mount is readOnly, so this uid can still only read.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: docker.io/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/app.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: "8080"
            - name: URL_PREFIX
              value: /console
            - name: HIVE_API
              value: http://hive.hive.svc.cluster.local:3002
            - name: HIVE_DATA
              value: /hive-data
            - name: CONTRIB_NS
              value: hive-contributors
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef: { name: hive-secrets, key: HIVE_DASHBOARD_TOKEN }
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef: { name: hive-secrets, key: DEEPSEEK_API_KEY, optional: true }
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            # READ-ONLY on purpose: this is hive's live state volume. The
            # console reads the session store (for auth) and the Claude OAuth
            # token (for the Anthropic headroom probe) and must never write.
            - name: hive-data
              mountPath: /hive-data
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: app
          configMap:
            name: hive-console-app
        - name: hive-data
          persistentVolumeClaim:
            claimName: hive-data
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: hive-console
  namespace: hive
spec:
  selector:
    app.kubernetes.io/name: hive-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Same host as the hive dashboard ON PURPOSE — that is what lets the browser
# send the `hive_session` cookie to the console, so one GitHub device-flow
# login at hive.tunaos.org authenticates both. A separate hostname would need
# its own DNS record, its own certificate, and its own login.
#
# Traefik matches the longer prefix first, so /console reaches this Service
# while everything else still falls through to hive itself. The TLS secret is
# the one cert-manager already issues for the hive-public Ingress; this Ingress
# deliberately carries NO cert-manager annotation so it reuses that certificate
# instead of racing to issue a second one for the same host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hive-console
  namespace: hive
spec:
  ingressClassName: traefik
  rules:
    - host: hive.tunaos.org
      http:
        paths:
          - path: /console
            pathType: Prefix
            backend:
              service:
                name: hive-console
                port:
                  number: 8080
  tls:
    - hosts: [hive.tunaos.org]
      secretName: hive-tunaos-org-tls
