# hive-ops — the hive's operational control plane, in the cluster.
#
# Stage 1 of talos-os/hive#15: the SAME scripts that ran as systemd user timers
# on a workstation, running as CronJobs next to the thing they manage. No
# rewrite — the 545 comment lines in hive-rotate.sh are hard-won policy (see the
# RFC), and porting them to a new runtime is how they get lost.
#
# WHAT THIS FIXES
#   - The control plane no longer stops when a desktop sleeps. Two agents once
#     sat in PaneShowsLogin for 43h because nothing was running to heal them.
#   - Rotation state moves off ~/.local/state and into a PVC beside the cluster
#     it describes. A truncated `stranded` journal previously left 8 agents
#     paused on healthy providers with nothing left that knew to free them.
#
# ALL EIGHT jobs moved; nothing operational is left on the workstation.
# `gh` is absent from the stock image, so hive-metrics.sh was converted to mint
# a GitHub App installation token and call the REST API with curl — which is
# also the more correct identity (the App, not somebody's personal keyring
# token). `git` IS present, so hive-fork-drift.sh moved unchanged.
#
# Every job's POD carries the same app.kubernetes.io/{name,component} labels as
# its CronJob. Labels on a CronJob do NOT propagate to the pods it creates, so
# without the pod-template copy `kubectl logs -n hive -l
# app.kubernetes.io/component=rotate` matches nothing — which is exactly what
# every log command in the docs was silently doing until 2026-09-02.
#
# Deploy with talos-k8s/hive-ops/deploy.sh — it publishes the scripts as a
# ConfigMap from their canonical home in roles/hive_ops/files/bin/ so the code
# stays lintable in one place rather than being duplicated into YAML.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-ops
  namespace: hive
---
# The scripts drive the hive through its own API, reached with `kubectl exec`
# into the hive pod — the same ladder they used from outside. Being in-cluster
# does not remove that requirement: X-Hive-Internal is read-only for mutations,
# so writes still need the owner session cookie read from the pod's PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-ops
  namespace: hive
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hive-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch]
  # fork-switch reads the current image and patches it on swap/rollback
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-ops
  namespace: hive
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-ops
---
# The fork-switch controller reads node architecture (cluster-scoped) and
# patches the hive Deployment image in both hives.
#
# Without the nodes read it cannot evaluate its platform gate at all, and on its
# first in-cluster run the missing Deployment read made every hive look
# unhealthy -- which, in upstream mode, would have rolled back a healthy fleet
# on a permissions error. The script now treats unreadable state as UNKNOWN
# rather than unhealthy, but it still needs these to do its job.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hive-ops-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hive-ops-nodes
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hive-ops-nodes
---
# Burn-rate pacing spans BOTH hives, because the thing it paces does too: one
# Anthropic subscription is drained by school's 11 agents and reef's 11
# together. A pacer that could only actuate school would shed load, watch reef
# absorb the slack, observe no improvement, and shed again — so reef access is
# not an optional extra here, it is what makes the control loop stable.
#
# Same verb set as the `hive` Role and no more: read pods, exec into the pod to
# reach its API, read the dashboard secret, publish the verdict ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-ops-reef
  namespace: hive-reef
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hive-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-ops-reef
  namespace: hive-reef
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-ops-reef
---
# hive-hanthor was stood up 2026-09-04 but never wired into this control plane.
# Four of its agents sat at `login required detected` for two days with nothing
# running to act on it — the exact failure that moved hive ops into the cluster
# in the first place. Same Role as reef, verbatim.
#
# `kubectl auth can-i --as=system:serviceaccount:hive:hive-ops` answers "yes"
# here even for a namespace that does not exist. It is not a usable check; the
# RoleBinding list is.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-ops-hanthor
  namespace: hive-hanthor
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hive-secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-ops-hanthor
  namespace: hive-hanthor
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-ops-hanthor
---
# Discord alerting credentials live in the postgres namespace (fleet-alerts).
# Without this the fork checkers compute a correct verdict and then cannot
# deliver it: hive-fork-drift printed "no Discord credentials available — alert
# logged only" on every run, so its alert reached a CronJob log and nobody else.
#
# NOTE `kubectl auth can-i get secret/fleet-alerts -n postgres --as=<sa>`
# answered "yes" while the pod's own read returned Forbidden. Trust the real
# operation, not the permission check.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-ops-alerts
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [fleet-alerts]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-ops-alerts
  namespace: postgres
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-ops-alerts
---
# Contributor reconciliation scales Deployments in the neighbouring namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-ops-contributors
  namespace: hive-contributors
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-ops-contributors
  namespace: hive-contributors
subjects:
  - kind: ServiceAccount
    name: hive-ops
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-ops-contributors
---
# Rotation state: the stranded journal, rotation history, canary cooldowns and
# per-agent kick backoff. Small, but it MUST outlive a job pod — losing the
# stranded journal is precisely what stranded 8 agents indefinitely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-ops-state
  namespace: hive
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-watchdog
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog}
spec:
  schedule: "*/5 * * * *"
  # The script is explicitly not safe to run twice at once: /api/status lags a
  # mutation by >10s, so a second pass decides on pre-mutation state ("do not
  # chain apply runs"). Forbid, never Allow.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          # local-path PVCs bind to one node; the hive pod is pinned there too,
          # so the job must land on the same node to mount the state volume.
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-rotate.sh", "watchdog"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                # In-cluster: no kubeconfig. The scripts default KUBECONFIG to a
                # workstation path, so point it at nothing and let client-go use
                # the ServiceAccount.
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-rotate
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: rotate}
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # `apply` legitimately takes ~2 minutes (the pane probes are deliberately
      # unhurried); give it real headroom rather than killing a healthy run.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: rotate}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-rotate.sh", "apply"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# Watchdog for the SECOND hive. reef ran for hours with 7 of its 11 agents
# parked on the Claude Code login-method picker while /api/status still
# reported state=running and busy=working for every one of them — the only
# tell was the pane itself. Nothing healed it, because hive-rotate.sh had
# NS=hive hardcoded and this fleet has had two spokes since the split.
#
# `watchdog` only classifies panes and heals; it does not publish the usage
# ConfigMap and does not scale contributors (that pool is fleet-wide and stays
# owned by the primary hive via HIVE_PRIMARY_NS), so running a second copy
# against reef cannot race the first.
#
# Offset to :02 so the two watchdogs never exec into the API at the same moment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-watchdog-reef
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog-reef}
spec:
  schedule: "2-59/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog-reef}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-rotate.sh", "watchdog"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_NS, value: hive-reef}
                - {name: HIVE_PRIMARY_NS, value: hive}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate-reef}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# Watchdog for the THIRD spoke. hive-hanthor was created 2026-09-04 and never
# wired in: four agents (architect, ci-maintainer, sec-check, strategist) paused
# themselves with `login required detected` and stayed that way for two days,
# because no job anywhere ran with HIVE_NS=hive-hanthor. That is the same class
# of failure that moved hive ops off a workstation in the first place.
#
# Own state dir — sharing /state/hive-rotate with the primary hive would stomp
# its rotation journal, which is how 8 agents once stayed paused on healthy
# providers.
#
# Offset to :04 so hive (*/5), reef (:02) and hanthor never exec into the API on
# the same minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-watchdog-hanthor
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog-hanthor}
spec:
  schedule: "4-59/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: watchdog-hanthor}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-rotate.sh", "watchdog"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_NS, value: hive-hanthor}
                - {name: HIVE_PRIMARY_NS, value: hive}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate-hanthor}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}

---
# Fork switch controller: evaluate the gates weekly, right after the AI capability check, and swap or hold
#
# The first MANUAL attempt at this swap took hive-reef down for two minutes.
# The capability check was correct -- upstream v4 really does ship branding.go
# -- but ghcr.io/kubestellar/hive:latest publishes linux/arm64 ONLY and these
# nodes are amd64, and the deployment uses strategy Recreate so the old pod is
# gone before the new one is proven. Every gate in this script is a thing that
# has already gone wrong once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-fork-switch
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-switch}
spec:
  schedule: "50 6 * * 1"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-switch}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-fork-switch.sh", "reconcile"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# Fork switch controller: content-check the deployed image DAILY and revert if branding regresses
#
# The first MANUAL attempt at this swap took hive-reef down for two minutes.
# The capability check was correct -- upstream v4 really does ship branding.go
# -- but ghcr.io/kubestellar/hive:latest publishes linux/arm64 ONLY and these
# nodes are amd64, and the deployment uses strategy Recreate so the old pod is
# gone before the new one is proven. Every gate in this script is a thing that
# has already gone wrong once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-fork-verify
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-verify}
spec:
  schedule: "10 7 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-verify}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-fork-switch.sh", "verify"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# AI fork check: has upstream grown what our fork carries, IN SOME FORM?
#
# hive-fork-drift asks a git question (are we still ahead, are OUR pr numbers
# merged). That has a blind spot that widens over time: our branding PR #5690
# was CLOSED, so commit-identity matching would report "still needed" forever
# even after upstream shipped the same capability by another route -- which is
# exactly what happened. This asks the capability question instead.
#
# WEEKLY. It is a "has the world changed" check, not a control loop, and it
# spends the same provider quota the agents need.
#
# Never auto-acts: a merged verdict posts to Discord and stops there. Retiring
# a fork is an image swap with a branding regression behind it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-fork-ai-check
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-ai-check}
spec:
  schedule: "20 6 * * 1"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: fork-ai-check}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-fork-ai-check.sh", "check"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# Model inventory: what each backend can ACTUALLY run today.
#
# DAILY, not weekly like hive-tiers. Vendors ship on their own schedule and a
# hardcoded ladder does not fail loudly when they do — it quietly keeps using
# last season's model. Measured on the first run: agy had shipped
# gemini-3.8-flash-{high,medium,low} while the table still pinned 3.7/3.6, and
# three tier ids did not exist at all (claude-haiku-4-5, deepseek-chat,
# gemini-3.6-flash). Nothing noticed, because nothing was looking.
#
# This is the GATE half of tiering; hive-tiers.sh is the RANKING half. Rungs are
# filtered to models the inventory confirms, per provider, so a rung can never
# name an id the CLI would reject. Rotation fails open if the inventory is
# missing or stale.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-inventory
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: inventory}
spec:
  schedule: "40 5 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: inventory}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-inventory.sh", "collect"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_ROTATE_STATE, value: /state/hive-rotate}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
---
# Burn-rate pacing. Distinct from hive-rotate on purpose: rotate answers "can
# this provider serve at all" (a threshold), pace answers "should we be going
# this fast" (a rate). A threshold cannot see either failure — burning a weekly
# cap in three hours and then sitting idle, or letting it reset unspent.
#
# The fit needs SAMPLES: percent is an integer, so a two-point delta is
# dominated by quantization, and the whole reason this is a CronJob with a PVC
# instead of a one-shot calculation is to accumulate enough history to
# distinguish 6 %/hr from 18 %/hr.
#
# Locked to hive-rotate's 20-minute cadence, offset to :05 so it runs just
# AFTER rotate's :00/:20/:40. It makes NO provider calls of its own — it reads
# the ConfigMap rotate publishes. A first attempt polled every 10 minutes with
# its own Anthropic probe and immediately earned `rate_limit_error` from
# api.anthropic.com, degrading the rotator's availability reading as well.
# Sampling faster than the upstream measurement refreshes buys nothing anyway:
# it just records the same number three times and flatters the fit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-pace
  namespace: hive
  labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: pace}
spec:
  schedule: "5,25,45 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: hive-ops, app.kubernetes.io/component: pace}
        spec:
          restartPolicy: Never
          serviceAccountName: hive-ops
          nodeSelector: {workload-role: hive}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ops
              image: alpine/k8s:1.31.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/hive-pace.sh", "apply"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - {name: KUBECONFIG, value: ""}
                - {name: HIVE_PACE_STATE, value: /state/hive-rotate}
                - {name: HIVE_PACE_NAMESPACES, value: "hive hive-reef hive-hanthor"}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: scripts, configMap: {name: hive-ops-scripts, defaultMode: 0755}}
            - {name: state, persistentVolumeClaim: {claimName: hive-ops-state}}
            - {name: tmp, emptyDir: {}}
