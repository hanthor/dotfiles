# Stops the AWS KubeVirt node (aws/kubevirt.tf) when nobody has used corral
# for IDLE_MINUTES (default 3 h). The signal is corral-web's
# corral_last_activity_timestamp_seconds (tuna-os/corral#355): the last
# request from a person, with probes and scrapes excluded. An open corral tab
# counts, because the UI polls. Running VMs do NOT keep the node awake on
# their own. In-progress work that would be corrupted by a stop does: Jobs
# and CDI importer/upload pods on the node.
#
# Until corral-web exposes the gauge, the fallback is the older rule: no
# workload pods on the node for IDLE_MINUTES.
#
# Start it again with the corral-web power button or `scripts/kubevirt-node up`.
#
# Credentials: secret kubevirt-aws/node-power holds an access key for IAM
# user kubevirt-node-power, which can only start/stop/describe this one
# instance. Create it by hand; it is never committed:
#   kubectl -n kubevirt-aws create secret generic node-power \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=INSTANCE_ID=i-...
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-aws
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idle-stop
  namespace: kubevirt-aws
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-idle-stop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubevirt-idle-stop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubevirt-idle-stop
subjects:
  - kind: ServiceAccount
    name: idle-stop
    namespace: kubevirt-aws
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idle-stop
  namespace: kubevirt-aws
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: idle-stop
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: idle-stop
              image: alpine/k8s:1.36.4
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              env:
                - name: HOME
                  value: /tmp
                - name: IDLE_MINUTES
                  value: "180"
                - name: CORRAL_METRICS_URL
                  value: http://corral-web.tailvm.svc/metrics
                - name: AWS_DEFAULT_REGION
                  value: eu-north-1
              envFrom:
                - secretRef:
                    name: node-power
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                    --query 'Reservations[0].Instances[0].State.Name' --output text)
                  [ "$state" = running ] || { echo "instance $state"; exit 0; }
                  node=$(kubectl get nodes -l tunaos.org/kubevirt=true -o jsonpath='{.items[0].metadata.name}')
                  [ -n "$node" ] || { echo "node not registered yet"; exit 0; }
                  now=$(date +%s)
                  pods=$(kubectl get pods -A --field-selector "spec.nodeName=$node" -o json)
                  # Work a stop would corrupt: Jobs (ISO builds, bootc disk
                  # builds) and CDI importer/upload pods.
                  critical=$(echo "$pods" | jq '[.items[]
                    | select(.status.phase == "Running" or .status.phase == "Pending")
                    | select(((.metadata.ownerReferences // [])[0].kind == "Job")
                             or ((.metadata.labels // {})["app"] // "" | test("containerized-data-importer"))
                             or ((.metadata.name) | test("^(importer|cdi-upload)-")))] | length')
                  if [ "$critical" -gt 0 ]; then
                    echo "$critical build/import pod(s) on $node; not idle"
                    exit 0
                  fi
                  last=$(curl -fsS -m 10 "$CORRAL_METRICS_URL" 2>/dev/null \
                    | awk '/^corral_last_activity_timestamp_seconds /{printf "%d", $2}')
                  if [ -n "$last" ]; then
                    idle=$(( (now - last) / 60 ))
                    echo "corral last used ${idle}m ago (threshold ${IDLE_MINUTES}m)"
                    if [ "$idle" -ge "$IDLE_MINUTES" ]; then
                      aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
                      echo "stopped $INSTANCE_ID: corral idle ${idle}m"
                    fi
                    exit 0
                  fi
                  # Fallback while corral-web lacks the activity gauge.
                  busy=$(echo "$pods" | jq '[.items[]
                    | select((.metadata.ownerReferences // [])[0].kind != "DaemonSet")
                    | select(.status.phase == "Running" or .status.phase == "Pending")] | length')
                  if [ "$busy" -gt 0 ]; then
                    echo "$busy workload pod(s) on $node (no corral activity gauge yet)"
                    kubectl annotate node "$node" tunaos.org/idle-since- >/dev/null 2>&1 || true
                    exit 0
                  fi
                  since=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.tunaos\.org/idle-since}')
                  if [ -z "$since" ]; then
                    kubectl annotate node "$node" tunaos.org/idle-since="$now" --overwrite
                    echo "idle from now"; exit 0
                  fi
                  idle=$(( (now - since) / 60 ))
                  echo "idle ${idle}m"
                  if [ "$idle" -ge "$IDLE_MINUTES" ]; then
                    kubectl annotate node "$node" tunaos.org/idle-since-
                    aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
                    echo "stopped $INSTANCE_ID"
                  fi
