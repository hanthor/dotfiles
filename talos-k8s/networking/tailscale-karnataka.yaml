# Tailscale ExtensionServiceConfig for karnataka (worker)
# Before applying: replace TS_AUTHKEY below with a fresh key from the
# Tailscale admin console (or the 'tailscale-authkey' Bitwarden item) —
# never commit a real key here, this file is public.
# Apply: talosctl -n 192.168.0.6 patch mc -p @talos-k8s/tailscale-karnataka.yaml
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: tailscale
environment:
  - TS_AUTHKEY=REPLACE_WITH_KEY_FROM_BITWARDEN
  - TS_HOSTNAME=karnataka
  - TS_ACCEPT_DNS=true
