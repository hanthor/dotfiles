# In-cluster deployment for the secret-broker (Talos-native option, #49).
#
# RUNBOOK ARTIFACT / TEMPLATE — untested (the Talos cluster was offline when this
# was written). Fill in the image ref, the Secret values, and policy.json, then
# `kubectl apply -f`. Prefer a VPS + systemd unit for a bootstrap-of-trust broker
# that must stay available even when the cluster is down (see the README).
#
# The broker joins the tailnet itself via tsnet using TS_AUTHKEY (mint an
# ephemeral, tagged key). It is reached over the tailnet by MagicDNS, so there is
# NO Kubernetes Service — nothing is exposed to the cluster network.
---
apiVersion: v1
kind: Namespace
metadata:
  name: secret-broker
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-broker-env
  namespace: secret-broker
type: Opaque
stringData:
  # Mint an ephemeral, tag:secret-broker auth key in the Tailscale admin.
  TS_AUTHKEY: "tskey-auth-REPLACE_ME"
  # Regular Bitwarden vault creds for the read-only onboarding-collection account
  # (bw login done in the image/initContainer). Session self-refreshes via password.
  BW_SESSION: "REPLACE_ME"
  BW_PASSWORD: "REPLACE_ME"
  # Comma-separated admin StableNodeIDs allowed to approve nodes.
  BROKER_ADMINS: "nREPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-broker-policy
  namespace: secret-broker
data:
  # Same shape as policy.example.json (no secret material — just which SM secret
  # ids each StableNodeID may receive).
  policy.json: |
    {
      "defaults": [],
      "nodes": {}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-broker
  namespace: secret-broker
spec:
  replicas: 1
  # tsnet keeps node state on disk; more than one replica would fight over the
  # same tailnet identity. Keep it at 1 (Recreate avoids two live at once).
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: secret-broker }
  template:
    metadata:
      labels: { app: secret-broker }
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532 # distroless nonroot uid/gid, so the state volume is writable
      containers:
        - name: secret-broker
          image: ghcr.io/hanthor/secret-broker:latest # REPLACE with a pinned digest
          args: ["-source=bw", "-config=/etc/broker/policy.json"]
          env:
            - { name: TS_STATE_DIR, value: /var/lib/tsnet }
          envFrom:
            - secretRef: { name: secret-broker-env }
          volumeMounts:
            - { name: state, mountPath: /var/lib/tsnet }
            - { name: policy, mountPath: /etc/broker, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: state
          emptyDir: {} # ephemeral tailnet state — fine with an ephemeral authkey
        - name: policy
          configMap: { name: secret-broker-policy }
