[tasks.units]
description = "Run every unit in parallel; one failing unit does not stop the others"
depends = ["unit:*"]

[tasks."unit:omp"]
description = "omp: skills, Kiro plugin, routing, and the auth-broker client"
file = "units/omp.sh"

[tasks."unit:chezmoi"]
description = "chezmoi: shell, git, neovim and atuin config files from home/"
file = "units/chezmoi.sh"

[tasks."unit:atuin"]
description = "atuin: sync login from Bitwarden and history import"
file = "units/atuin.sh"

[tasks."unit:shell-ai"]
description = "shell-ai: API secrets from Bitwarden into the shell secret files"
file = "units/shell-ai.sh"

[tasks."unit:fonts"]
description = "fonts: JetBrains Mono Nerd Font on desktops"
file = "units/fonts.sh"

[tasks."unit:github"]
description = "github: gh login from Bitwarden and SSH key registration"
file = "units/github.sh"

[tasks."unit:kube"]
description = "kube: kubeconfig and talosconfig for the home and AWS clusters from Bitwarden"
file = "units/kube.sh"

[tasks."unit:forgejo-registry"]
description = "forgejo-registry: podman login to the private Forgejo registry"
file = "units/forgejo-registry.sh"
