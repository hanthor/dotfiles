# Exceptions to hive-roster-sync's rule (every hanthor repo that is not
# archived and not a fork is in the hanthor hive). Installed at
# /var/srv/hives-host/hanthor-roster.conf. One "<verb> <repo name>" per line.

# Forks that stay in the hive anyway.
keep shrimply            # in the hive before the no-forks rule (2026-11-20)

# Eligible repos the hive must not touch.
exclude hive-upstream-secfix-ci   # private, embargoed upstream security fix
exclude hive-lite-sandbox         # target repo for hive-lite fix-mode tests
