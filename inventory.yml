---
all:
  hosts:
    # `tailnet_name`: the host's MagicDNS name when it isn't the inventory
    # name; scripts/online_hosts.py matches online peers by it.
    # punjab is a KubeVirt VM on karnataka since 2026-10-27 (corral-vms/punjab).
    # The old EC2 instance is tailnet node punjab-aws-retired (100.78.73.8).
    punjab:
      ansible_host: 100.103.187.46
      ansible_user: ubuntu  # Ubuntu 24.04 image; there is no `james` here
      ansible_connection: ssh
    # This targets the Debian VM running via Android's Virtualization
    # Framework on the phone (tailnet node name "mumbai"), not the raw
    # Termux/Android layer itself — that's the separate `termux` host below.
    mumbai:
      ansible_host: 100.86.202.86
      ansible_port: 2222
      ansible_user: james
      ansible_connection: ssh
    # Raw Termux/Android layer on the phone (tailnet node name "pixel-9a").
    # Android/bionic libc — no root, no systemd, no Homebrew. Package
    # management goes through the termux_packages role, gated on this group.
    termux:
      ansible_host: 100.115.116.35
      ansible_port: 8022
      ansible_user: u0_a372
      ansible_connection: ssh
      tailnet_name: pixel-9a
    goa:
      ansible_host: localhost
      ansible_connection: local
    kerala:
      ansible_host: 100.96.124.92
      ansible_user: james
      ansible_connection: ssh
      tailnet_name: kerala-1
    vm:
      ansible_host: localhost
      ansible_connection: local
    # ── Home servers (Bluefin + k3s since 2026-10/11; the Talos cluster is archived) ──
    # bihar: active hive host + KubeStellar hub. Bootstrapped with `just apply`
    # on 2026-11-17 (desktop group, as bootstrap.sh registered it).
    bihar:
      ansible_host: 100.103.44.48
      ansible_user: james
      ansible_connection: ssh
    # karnataka: k3s/KubeVirt host (punjab runs on it). Configured from the
    # feat/native-laptop-units branch (hanthor/dotfiles#348), not this inventory.
    matrix:
      ansible_host: 100.73.19.81
      ansible_connection: ssh
      tailnet_name: reilly-asia-matrix
    telengana:
      ansible_host: 100.101.234.32
      ansible_connection: ssh
    himachal:
      ansible_host: 100.73.3.51
      ansible_connection: ssh
    dilli:
      ansible_host: dilli
      ansible_user: james
      ansible_connection: ssh
    kanpur:
      ansible_host: 100.107.52.37
      ansible_connection: ssh
    # ── KubeVirt test fleet VMs (accessible via virtctl port-forward) ──
    # Requires: virtctl port-forward -n default vmi/<name> <port>:22
    test-fleet-fedora:
      ansible_host: 127.0.0.1
      ansible_port: 22024
      ansible_connection: ssh
    test-fleet-node2:
      ansible_host: 127.0.0.1
      ansible_port: 22026
      ansible_connection: ssh
  children:
    desktop:
      hosts:
        bihar:
        mumbai:
        kerala:
        kanpur:
        himachal:
        dilli:
    # llm group is dormant — karnataka (former LLM host) now runs k3s workloads
    # llm:
    #   hosts:
    #     karnataka:
    server:
      hosts:
        punjab:
        vm:
        goa:
    test_fleet:
      hosts:
        test-fleet-fedora:
        test-fleet-node2:
    vps:
      hosts:
        matrix:
        telengana:
    termux_hosts:
      hosts:
        termux:
