    # name; scripts/online_hosts.py matches online peers by it.
    punjab:
      # Karnataka replacement; retain its staging identity until rename is confirmed.
      ansible_host: 100.103.187.46
      ansible_user: ubuntu
      ansible_connection: ssh
      tailnet_name: punjab-migration
    # This targets the Debian VM running via Android's Virtualization
    # Framework on the phone (tailnet node name "mumbai"), not the raw
    # Termux/Android layer itself — that's the separate `termux` host below.
    mumbai:
      ansible_host: 100.86.202.86
      ansible_port: 2222
      ansible_user: james
      ansible_connection: ssh
    # Raw Termux/Android layer on the phone (tailnet node name "pixel-9a").
