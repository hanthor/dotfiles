---
is_laptop: true
dotfiles_update_delay_seconds: 90
# Keep login responsive; run `just apply-nosecrets` manually when desired.
dotfiles_auto_update: false
# Phone pushes launch two Ansible runs and are better done on demand.
phone_apply_enabled: false
web_services: []
mic_hardware_volume_pct: 75

# The AWS cluster was terminated; local Hive ops remain disabled.
# The role removes any old local timers on the next apply.
hive_ops_enabled: false
