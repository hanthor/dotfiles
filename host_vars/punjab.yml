is_arm: false
# Headless agent box: no tailnet Caddy proxy (needs podman quadlets, absent on stock Ubuntu)
skip_proxy: true
# Runs the OpenTofu config in aws/ (the AWS account's IaC) — see docs/src/servers/aws/README.md
extra_brews:
  - awscli
  - session-manager-plugin
  - opentofu
# Internet-facing EC2 box: stricter sshd drop-in (sshd role)
sshd_harden: true
# Kiro Crew gateway (kirocrew role)
kirocrew_enabled: true
