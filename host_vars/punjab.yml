# Headless agent box: keep the existing no-proxy policy during migration.
skip_proxy: true
# AWS administration tools remain useful on the Karnataka replacement.
# aws/ still describes the old EC2 resources; see docs/src/servers/aws/README.md.
extra_brews:
  - awscli
  - session-manager-plugin
  - opentofu
# Retain stricter sshd policy on the replacement (sshd role).
sshd_harden: true
# Always-on fleet observer; reuse this account's existing Tailscale/SSH access.
osquery_poller_enabled: true
