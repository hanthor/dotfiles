# The old role's yq is Alpine's yq-go (Mike Farah); core bootstrap is
# independent of legacy packages that may not exist on a given release.
APK_BOOTSTRAP=(chezmoi yq-go python3 py3-yaml just)
APK_PACKAGES=(
  bash fish zsh git git-lfs delta vim neovim tmux openssh-client curl wget
  jq ripgrep fd fzf starship bat exa direnv zoxide atuin-sync shellcheck shfmt
  nodejs npm busybox-extras podman podman-compose crun iptables
)
APK_OPTIONAL=(mise)
