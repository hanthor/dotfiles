---
- name: Configure workstation
  hosts: "{{ target | default(lookup('file', '/etc/dotfiles-machine', errors='ignore') | default('localhost')) }}"
  gather_facts: true

  pre_tasks:
    - name: Set convenience facts
      ansible.builtin.set_fact:
        is_desktop: "{{ is_desktop | default(inventory_hostname in groups.get('desktop', [])) }}"
        is_laptop: "{{ is_laptop | default(false) }}"
        brew_bin: "{{ brew_prefix }}/bin"
        machine_profile: "{{ machine_profile | default('') }}"
      tags: always

    - name: Ensure brew is in PATH for this run
      ansible.builtin.set_fact:
        ansible_env_path: "{{ brew_bin }}:{{ ansible_facts['env']['PATH'] }}"
      tags: always

    # Platform detection, computed once — apk_packages, homebrew, and
    # termux_packages each need to know libc flavor to decide whether to
    # run; previously each re-implemented the same stat checks.
    - name: Detect musl libc
      ansible.builtin.stat:
        path: "{{ item }}"
        get_mime: false
        get_checksum: false
        get_attributes: false
      register: _musl_stat
      loop:
        - /lib/ld-musl-x86_64.so.1
        - /lib/ld-musl-aarch64.so.1
      tags: always

    - name: Detect Termux (Android/bionic libc)
      ansible.builtin.stat:
        path: /data/data/com.termux/files/usr
        get_mime: false
        get_checksum: false
        get_attributes: false
      register: _termux_stat
      tags: always

    - name: Set platform facts
      ansible.builtin.set_fact:
        is_musl: "{{ _musl_stat.results | selectattr('stat.exists') | list | length > 0 }}"
        is_termux: "{{ _termux_stat.stat.exists }}"
      tags: always

  environment:
    PATH: "{{ brew_bin | default('/home/linuxbrew/.linuxbrew/bin') }}:/home/linuxbrew/.linuxbrew/bin:/data/data/com.termux/files/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # Termux's non-interactive module execution doesn't reliably inherit
    # HOME (Android has no real getpwuid()-backed home dir for the app
    # user), which breaks every "~/..." dest: path in copy/template tasks.
    # Re-assert it from the fact already gathered at play start.
    HOME: "{{ ansible_facts['env']['HOME'] | default(omit) }}"

  roles:
    - role: sudo
      tags: [system, sudo]
      when: not skip_sudo | default(false)
    # Phase 1: System + packages (no secrets needed)
    - role: sshd
      tags: [system, sshd]
    - role: apk_packages
      tags: [system, packages, apk]
    - role: homebrew
      tags: [packages, homebrew]
    - role: termux_packages
      tags: [system, packages, termux]
      when: inventory_hostname in groups.get('termux_hosts', [])
    - role: bitwarden
      tags: [secrets, bitwarden]
    - role: shell_fonts
      tags: [dotfiles, shell, fonts]
    - role: shell_dotfiles
      tags: [dotfiles, shell, dotfiles]
    - role: pi
      tags: [dotfiles, pi]
    - role: git
      tags: [dotfiles, git]
    - role: neovim
      tags: [dotfiles, neovim, editor]

    # Phase 2: Secrets + auth
    - role: shell_atuin
      tags: [dotfiles, shell, atuin, secrets]
    - role: shell_ai
      tags: [dotfiles, shell, ai, secrets]
    - role: ssh_keys
      tags: [secrets, ssh, ssh_keys]
    - role: ssh_mesh
      tags: [ssh, mesh_check]
      when: machine_profile != 'vm-test' and not skip_ssh_mesh | default(false)
    - role: github
      tags: [secrets, github]
    - role: tailscale
      tags: [secrets, tailscale]
    - role: kube
      tags: [secrets, kube]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_kube | default(false)

    # Phase 3: Desktop apps
    - role: flatpak
      tags: [packages, desktop, flatpak]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_flatpak | default(false)
    - role: bluefin_common
      tags: [desktop, bluefin]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_bluefin | default(false)
    - role: gnome
      tags: [desktop, gnome]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_gnome | default(false)
    - role: zen_browser
      tags: [desktop, browser, zen_browser]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_zen_browser | default(false)
    - role: pipewire_audio
      tags: [desktop, audio, pipewire]
      when: is_desktop | bool and machine_profile != 'vm-test' and not skip_pipewire_audio | default(false)

    # Phase 4: Services
    - role: monitoring
      tags: [services, monitoring]
      when: inventory_hostname not in groups.get('vps', []) and machine_profile != 'vm-test' and not skip_monitoring | default(false)
    - role: syncthing
      tags: [services, syncthing]
      when: inventory_hostname not in groups.get('vps', []) and machine_profile != 'vm-test' and not skip_syncthing | default(false)
    - role: systemd
      tags: [services, systemd]
      when: not skip_systemd | default(false)
    - role: bst_dashboard
      tags: [services, bst_dashboard]
    - role: proxy
      tags: [services, proxy, caddy]
      when: inventory_hostname not in groups.get('vps', []) and machine_profile != 'vm-test' and not skip_proxy | default(false)
    - role: tailscale_cert
      tags: [services, tailscale_cert]
      when: inventory_hostname not in groups.get('vps', []) and machine_profile != 'vm-test' and not skip_tailscale_cert | default(false)
    - role: cockpit
      tags: [services, cockpit]
      when: (is_desktop | bool or inventory_hostname in groups.get('server', [])) and machine_profile != 'vm-test' and not skip_cockpit | default(false)
    - role: server_hardening
      tags: [system, hardening, security]
      when: inventory_hostname in groups.get('server', []) or inventory_hostname in groups.get('vps', [])

  post_tasks:
    - name: Summarise secrets phase
      ansible.builtin.debug:
        msg: >-
          {% if 'secrets' in (ansible_skip_tags | default([])) %}
          [secrets phase] SKIPPED (--skip-tags secrets). Run `dots-apply` to include
          ssh_keys, github, kube, tailscale, monitoring, browser_fxa, and shell secrets.
          {% elif not (bw_unlocked | default(false)) %}
          [secrets phase] Bitwarden vault was LOCKED — BW-touching tasks in
          ssh_keys, github, kube, tailscale, monitoring, browser_fxa, and shell
          were skipped. To enable: `bw unlock`, write the session to
          /tmp/bw_session, then re-run.
          {% else %}
          [secrets phase] vault unlocked — all secret roles executed normally.
          {% endif %}
      tags: always
